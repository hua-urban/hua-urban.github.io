<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://script.google.com https://googleusercontent.com https://*.googleusercontent.com; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#8b1538">
  <meta name="description" content="華都更 Google 登入管理入口與會員名單唯讀查閱。">
  <title>會員名單｜華都更管理中心</title>
  <link rel="stylesheet" href="../admin.css">
  <script src="../../assets/member-registry.js" defer></script>
  <script src="../members.js?v=20261103-list" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../" aria-label="華都更管理中心首頁">
        <span class="brand-mark" aria-hidden="true">華</span>
        <span><strong>華都更</strong><small>管理中心</small></span>
      </a>
      <span class="header-note">會員名單</span>
    </div>
  </header>

  <main id="main" class="page-shell">
    <section class="page-intro">
      <nav class="breadcrumbs" aria-label="麵包屑導覽"><a href="../">服務目錄</a><span aria-hidden="true">/</span><span aria-current="page">會員名單</span></nav>
      <p class="eyebrow">MEMBER DIRECTORY</p>
      <h1>會員名單</h1>
      <p>此頁唯讀顯示會員名單；會員資料異動請使用 Google 登入管理入口。</p>
    </section>

    <section class="connect-panel" aria-labelledby="connection-title">
      <div class="connect-copy">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <h2 id="connection-title">Google 登入管理：<span id="connection-status">讀取入口設定中</span></h2>
          <p id="connection-detail">正在讀取管理入口設定…</p>
        </div>
      </div>
      <button id="edit-button" class="connect-action" type="button" disabled aria-describedby="connection-detail">Google 登入管理</button>
    </section>

    <section class="snapshot-section" aria-labelledby="snapshot-title">
      <div class="snapshot-heading">
        <div>
          <p class="eyebrow">MEMBER LIST</p>
          <h2 id="snapshot-title">會員名單</h2>
          <p>會員分組與產業鏈資訊，<a href="https://hua-urban.com/bni-pt-groups/" target="_blank" rel="noopener noreferrer">請查看產業鏈分組頁</a>。</p>
        </div>
        <span class="snapshot-badge">會員名單 · 唯讀</span>
      </div>
      <div class="snapshot-tools">
        <label class="visually-hidden" for="member-search">搜尋會員名單</label>
        <input id="member-search" type="search" placeholder="搜尋姓名、專業別、職務、分組或會員編號" autocomplete="off">
        <p id="snapshot-meta" class="snapshot-count" aria-live="polite">正在讀取名單確認日期…</p>
        <p id="snapshot-count" class="snapshot-count" aria-live="polite">正在載入會員名單…</p>
      </div>
      <div id="member-list" class="member-list" aria-live="polite">
        <p class="snapshot-message">正在載入會員名單…</p>
      </div>
      <p class="member-footnote">此頁僅供查閱，不提供會員資料修改。若連線失敗或無法確認最新名單，頁面會保留明確提示。</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner"><span>華都更管理中心</span><span>會員名單僅供查閱</span></div>
  </footer>
</body>
</html>
