<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://hua-urban.com; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#8b1538">
  <meta name="description" content="華都更會員管理入口與官網公開名冊。">
  <title>會員管理｜華都更管理中心</title>
  <link rel="stylesheet" href="../admin.css">
  <script src="../members.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../" aria-label="華都更管理中心首頁">
        <span class="brand-mark" aria-hidden="true">華</span>
        <span><strong>華都更</strong><small>管理中心</small></span>
      </a>
      <span class="header-note">會員管理</span>
    </div>
  </header>

  <main id="main" class="page-shell">
    <section class="page-intro">
      <nav class="breadcrumbs" aria-label="麵包屑導覽"><a href="../">服務目錄</a><span aria-hidden="true">/</span><span aria-current="page">會員管理</span></nav>
      <p class="eyebrow">MEMBER DIRECTORY</p>
      <h1>會員管理</h1>
      <p>官網公開名冊僅供查閱。會員編輯功能準備中，目前可查閱名冊。</p>
    </section>

    <section class="connect-panel" aria-labelledby="connection-title">
      <div class="connect-copy">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <h2 id="connection-title">會員編輯功能：<span id="connection-status">準備中</span></h2>
          <p id="connection-detail">會員編輯功能準備中，目前可查閱名冊。</p>
        </div>
      </div>
      <button id="edit-button" class="connect-action" type="button" disabled aria-describedby="connection-detail">編輯會員資料</button>
    </section>

    <section class="snapshot-section" aria-labelledby="snapshot-title">
      <div class="snapshot-heading">
        <div>
          <p class="eyebrow">PUBLIC ROSTER</p>
          <h2 id="snapshot-title">公開會員名冊</h2>
          <p>資料來源：華都更官網產業鏈分組頁所公開的會員資料。</p>
        </div>
        <span class="snapshot-badge">官網公開名冊 · 唯讀</span>
      </div>
      <div class="snapshot-tools">
        <label class="visually-hidden" for="member-search">搜尋公開會員名冊</label>
        <input id="member-search" type="search" placeholder="搜尋姓名、專業別、分組或會員編號" autocomplete="off">
        <p id="snapshot-count" class="snapshot-count" aria-live="polite">正在讀取公開會員名冊…</p>
      </div>
      <div id="member-list" class="member-list" aria-live="polite">
        <p class="snapshot-message">正在讀取官網公開會員名冊…</p>
      </div>
      <p class="member-footnote">官網公開名冊不是中央會員主檔，僅供查閱；此頁目前不提供會員資料修改。</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner"><span>華都更管理中心</span><span>官網公開名冊僅供查閱</span></div>
  </footer>
</body>
</html>
