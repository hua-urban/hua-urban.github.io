<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>需求媒合後臺｜華都更管理中心</title>
    <link rel="stylesheet" href="/property-platform/styles.css" />
  </head>
  <body
    data-entry-kind="admin"
    data-config-url="/property-platform/config.json"
  >
    <main class="leadership-login" id="main">
      <a class="hint" href="https://hua-urban.com/admin/">← 回華都更管理中心</a>
      <section class="panel leadership-login-card">
        <div class="brand">
          <span class="brand-mark">華</span>
          <div><strong>華都更</strong><small>LEADERSHIP ADMIN</small></div>
        </div>
        <h1>需求媒合後臺</h1>
        <p>董顧、九長及授權領導團隊專用。</p>
        <p class="hint">
          請使用已授權的 Google
          帳戶登入。後臺可盤點需求、記錄媒合與引薦，查看物件資料。
        </p>
        <div id="service-status" class="notice info" role="status">
          正在確認管理入口…
        </div>
        <a id="launch" class="btn primary" hidden>使用 Google 帳戶登入 →</a>
      </section>
    </main>
    <script src="/property-platform/entry.js" defer></script>
  </body>
</html>
