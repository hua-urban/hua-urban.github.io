<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>自動檢查狀態｜華都更管理中心</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f4;color:#202020;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:1060px;margin:auto;padding:24px 20px 64px}a{color:#701329;text-underline-offset:3px}h1{font-size:30px;line-height:1.3}h2{font-size:22px}p{margin:10px 0}.muted{color:#505050}.panel,.service{background:white;border:1px solid #c9c4c2;border-radius:12px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.service{margin:0;overflow-wrap:anywhere}.service h3{margin:0 0 10px;font-size:18px}.badge{display:inline-block;border-radius:30px;padding:3px 12px;font-weight:700;background:#414a52;color:white}.success{background:#176b4b}.failed{background:#8b1e35}.running{background:#754b00}.unknown{background:#414a52}button{background:#701329;color:white;border:0;border-radius:8px;padding:12px 18px;font:inherit;cursor:pointer}button:disabled{background:#505050}a:focus-visible,button:focus-visible{outline:3px solid #174f79;outline-offset:3px}.message{border-left:4px solid #8b1e35;padding-left:16px}li{margin:6px 0}time{font-variant-numeric:tabular-nums}</style></head><body><main><a href="../">← 管理中心</a><h1>自動檢查狀態</h1><p>後端網址、部署設定與相關排程的自動核對結果。</p><p class="muted">這些結果不代表 PALMS 統計日期或所有業務功能都已更新。排程約每15分鐘檢查部署異常，完整跨專案核對預定每天11:43；GitHub排程可能延遲。</p><button id="refresh" type="button">重新讀取狀態</button><div id="status" role="status" aria-live="polite">正在讀取…</div><section class="panel" aria-labelledby="audit-title"><h2 id="audit-title">完整跨專案核對</h2><div id="audit"></div></section><section aria-labelledby="services-title"><h2 id="services-title">各服務部署檢查</h2><div id="services" class="grid"></div></section><p class="muted">只有異常會透過華都更 LINE 小幫手通知資訊長；相同異常會去重。若通知本身失敗，此頁會顯示提醒。</p><p><a href="../updates/">資訊組更新日誌</a></p></main><script src="status.js"></script></body></html>
