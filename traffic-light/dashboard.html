<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>華都更 會員紅綠燈</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="BNI 華都更分會會員紅綠燈（分會領導團隊內部使用）">
  <link rel="stylesheet" href="./dashboard-core.css?v=20261013-flat">
</head>
<body>
  <main id="dashboardRoot" class="traffic-dashboard" aria-label="華都更會員紅綠燈"></main>
  <script src="./weekly-period.js?v=20261029-submission"></script>
  <script src="./export.js?v=20261005"></script>
  <script src="./dashboard-template.js?v=20261013-flat"></script>
  <script src="./dashboard-core.js?v=20261029-submission"></script>
  <script>
    (async function () {
      const root = document.getElementById('dashboardRoot');
      try {
        const response = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        let latestOfficialChapter = null;
        try {
          const monthlyResponse = await fetch('monthly.json', {cache:'no-store'});
          if (monthlyResponse.ok) {
            const monthly = await monthlyResponse.json();
            latestOfficialChapter = monthly.months && monthly.months.slice().sort(function (a, b) {
              return String(b && b.month || '').localeCompare(String(a && a.month || ''));
            })[0] || null;
          }
        } catch (error) {}

        const estimate = data.chapter && data.chapter.est;
        const provisional = estimate && Array.isArray(estimate.members) ? {
          members:estimate.members,
          chapter:estimate.chapter || {},
          updatedAt:estimate.updatedAt,
          prev:{updatedAt:data.updatedAt, chapter:data.chapter, members:data.members}
        } : null;
        const officialPeriod = (data.chapter || {}).period;
        const estimatePeriod = provisional && (provisional.chapter || {}).period;
        const view = {
          toggle:!!provisional,
          est:!!provisional && new URLSearchParams(location.search).get('v') === 'est',
          offPeriod:officialPeriod,
          estPeriod:provisional && provisional.chapter.asOf
            ? '查詢截至 ' + provisional.chapter.asOf : estimatePeriod + '（月結存檔）'
        };
        const selected = view.est ? provisional : data;
        if (view.est) document.title = '華都更會員紅綠燈｜暫定換算版';
        TrafficDashboard.mount(root, {
          members:selected.members,
          chapter:selected.chapter || {},
          updatedAt:selected.updatedAt,
          prev:selected.prev || null,
          leftMembers:data.leftMembers || []
        }, {
          view,
          latestOfficialChapter,
          compact:new URLSearchParams(location.search).get('embed') === '1',
          dataUrl:'data.json'
        });
      } catch (error) {
        root.textContent = '讀不到資料（' + String(error && error.message || error) + '）。如果是剛更新完，等 30 秒再重新整理。';
      }
    })();
  </script>
</body>
</html>
