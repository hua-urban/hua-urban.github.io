<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>上傳 PALMS 報告｜華都更</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="dashboard-core.css?v=20261013-flat">
<style>
body{margin:0;background:#f6f7f9;color:#181b1f;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
main{max-width:760px;margin:auto;padding:24px 18px 48px}a{color:#1f4e79}h1{font-size:28px;margin:20px 0 8px}#uploadRoot{background:transparent}#uploadRoot summary{cursor:pointer;color:#1f4e79;min-height:44px;padding:8px 0}#uploadRoot .fgrid{margin-top:12px}
</style>
</head><body><main>
<a href="./?v=est">← 返回最新週期統計</a>
<h1>上傳最新 PALMS 報告</h1>
<p id="uploadPeriod">選擇報告，核對資料後確認更新。</p>
<div id="uploadRoot" class="traffic-dashboard" data-theme="light"><p role="status">正在準備上傳…</p></div>
</main>
<script src="weekly-period.js?v=20261013"></script>
<script src="export.js?v=20261005"></script>
<script src="dashboard-template.js?v=20261013-flat"></script>
<script src="dashboard-core.js?v=20261013-upload"></script>
<script>
(async function(){
 const root=document.getElementById('uploadRoot');
 const end=WeeklyPeriod.latestWednesday();
 document.getElementById('uploadPeriod').textContent='本期建議期間：'+WeeklyPeriod.startFor(end)+' ～ '+end+'。選檔後會先顯示核對結果。';
 try{
  const responses=await Promise.all([fetch('data.json',{cache:'no-store'}),fetch('monthly.json',{cache:'no-store'})]);
  if(responses.some(r=>!r.ok))throw new Error('資料載入失敗');
  const [data,monthly]=await Promise.all(responses.map(r=>r.json()));
  TrafficDashboard.mount(root,data,{uploadOnly:true,view:{est:false,toggle:false},latestOfficialChapter:monthly.months[0]});
 }catch(e){root.textContent='暫時無法準備上傳，請重新整理。';}
})();
</script></body></html>
