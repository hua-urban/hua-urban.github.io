<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>華都更 會員紅綠燈</title>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="BNI 華都更分會會員紅綠燈（分會領導團隊內部使用）">
</head>
<body>
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#EFF1F4; --border:#DDE2E8;
  --text:#181B1F; --text-2:#565E67; --text-3:#89929C;
  --accent:#1F4E79; --accent-soft:#E7EEF5;
  --green:#12795A; --green-bg:#E0F0E9; --green-line:#17936C;
  --amber:#9E6F00; --amber-bg:#F8EED4; --amber-line:#C08D08;
  --red:#B23A2E; --red-bg:#F8E4E1; --red-line:#CF5244;
  --grey:#3C444C; --grey-bg:#E3E6EA; --grey-line:#525B64;
  --shadow:0 1px 2px rgba(20,26,33,.05), 0 8px 24px -12px rgba(20,26,33,.16);
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131619; --surface:#1B1F24; --surface-2:#22272D; --border:#2C333A;
    --text:#E9EDF1; --text-2:#A6AEB7; --text-3:#767F89;
    --accent:#7FB0DC; --accent-soft:#1B2A38;
    --green:#48C795; --green-bg:#122C23; --green-line:#2E9E74;
    --amber:#DFAA2C; --amber-bg:#2E2510; --amber-line:#B98B18;
    --red:#E87C6E; --red-bg:#301A17; --red-line:#C25547;
    --grey:#B9C1C9; --grey-bg:#1E2329; --grey-line:#8B949D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#131619; --surface:#1B1F24; --surface-2:#22272D; --border:#2C333A;
  --text:#E9EDF1; --text-2:#A6AEB7; --text-3:#767F89;
  --accent:#7FB0DC; --accent-soft:#1B2A38;
  --green:#48C795; --green-bg:#122C23; --green-line:#2E9E74;
  --amber:#DFAA2C; --amber-bg:#2E2510; --amber-line:#B98B18;
  --red:#E87C6E; --red-bg:#301A17; --red-line:#C25547;
  --grey:#B9C1C9; --grey-bg:#1E2329; --grey-line:#8B949D;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-sans); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:28px 20px 80px}
.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.eyebrow{
  font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--text-3); font-weight:600; margin:0 0 6px;
}
h1{font-size:clamp(26px,4vw,34px); line-height:1.2; letter-spacing:-.02em; margin:0; font-weight:700; text-wrap:balance}
.period{color:var(--text-2); font-size:14px; margin:6px 0 0}
.period b{color:var(--text); font-weight:600}
.scope{
  margin:12px 0 0; padding:9px 14px; font-size:13px; line-height:1.55;
  color:var(--text-2); background:var(--accent-soft);
  border-left:3px solid var(--accent); border-radius:0 8px 8px 0;
}
.scope b{color:var(--accent)}
.demo-tag{
  display:inline-block; margin-left:10px; padding:2px 8px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent); font-size:11.5px; font-weight:700;
  letter-spacing:.06em; vertical-align:3px;
}

/* ---------- distribution bar ---------- */
.dist{margin:26px 0 0; display:flex; flex-direction:column; gap:10px}
.dist-bar{display:flex; height:32px; border-radius:8px; overflow:hidden; border:1px solid var(--border)}
.dist-seg{display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:#fff; min-width:0}
.dist-legend{display:flex; flex-wrap:wrap; gap:8px 22px; font-size:13px; color:var(--text-2)}
.dist-legend span{display:inline-flex; align-items:center; gap:7px}
.dot{width:10px; height:10px; border-radius:3px; flex:none}
.goal{
  font-size:13px; color:var(--text-2); background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:10px 14px; margin-top:2px;
}
.goal b{color:var(--text)}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-top:4px}
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:13px 16px; border-left:4px solid var(--s-line);
}
.stat-label{
  font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-3); font-weight:700; margin:0 0 3px;
}
.stat-value{
  font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  font-size:27px; font-weight:700; line-height:1.1; letter-spacing:-.02em; color:var(--s-line);
}
.stat-value small{font-size:13px; font-weight:600; color:var(--text-3); letter-spacing:0; margin-left:3px}
.stat-note{font-size:12.5px; color:var(--text-2); margin:4px 0 0}
.stat-note b{color:var(--text); font-family:var(--font-mono)}
.s-green{--s-line:var(--green-line)}
.s-amber{--s-line:var(--amber-line)}
.s-red  {--s-line:var(--red-line)}
.s-grey {--s-line:var(--grey-line)}


/* ---------- tabs ---------- */
.tabs{display:flex; gap:4px; margin:30px 0 0; border-bottom:1px solid var(--border); flex-wrap:wrap}
.tab{
  appearance:none; background:none; border:0; border-bottom:2px solid transparent;
  padding:10px 14px; font:inherit; font-size:14.5px; font-weight:600; color:var(--text-2);
  cursor:pointer; margin-bottom:-1px;
}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.panel{padding-top:22px}
.panel[hidden]{display:none}

/* ---------- search ---------- */
.searchrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
.search{
  flex:1 1 260px; max-width:380px; padding:10px 14px; font:inherit; font-size:15px;
  border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--text);
}
.search:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
.filters{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  appearance:none; font:inherit; font-size:13px; font-weight:600; cursor:pointer;
  padding:7px 13px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-2);
}
.chip[aria-pressed="true"]{background:var(--text); color:var(--bg); border-color:var(--text)}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.count{font-size:13px; color:var(--text-3); margin-left:auto}

/* ---------- member cards ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(212px,1fr)); gap:12px}
.card{
  position:relative; text-align:left; font:inherit; cursor:pointer;
  background:var(--surface); border:1px solid var(--border); border-radius:11px;
  padding:14px 15px 14px 19px; overflow:hidden; color:var(--text);
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--tone-line)}
.card:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--tone-line)}
.card:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.card-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.name{font-weight:650; font-size:15.5px; letter-spacing:-.01em; line-height:1.3}
.rank{font-size:11.5px; color:var(--text-3)}
.score{font-size:32px; font-weight:700; line-height:1.05; letter-spacing:-.03em; color:var(--tone)}
.score small{font-size:14px; font-weight:600; color:var(--text-3); letter-spacing:0}
.card-bot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px}
.pill{
  font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px;
  background:var(--tone-bg); color:var(--tone);
}
.gap{font-size:12.5px; color:var(--text-2)}
.gap b{color:var(--text); font-family:var(--font-mono)}
.tone-green{--tone:var(--green); --tone-bg:var(--green-bg); --tone-line:var(--green-line)}
.tone-amber{--tone:var(--amber); --tone-bg:var(--amber-bg); --tone-line:var(--amber-line)}
.tone-red{--tone:var(--red); --tone-bg:var(--red-bg); --tone-line:var(--red-line)}
.tone-grey{--tone:var(--grey); --tone-bg:var(--grey-bg); --tone-line:var(--grey-line)}

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(12,16,20,.55); backdrop-filter:blur(2px);
  display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto; z-index:50;
}
.overlay[hidden]{display:none}
.sheet{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  width:100%; max-width:660px; box-shadow:var(--shadow); overflow:hidden;
}
.sheet-head{padding:20px 22px 18px; border-bottom:1px solid var(--border); background:var(--tone-bg)}
.sheet-head .row{display:flex; align-items:flex-start; justify-content:space-between; gap:14px}
.sheet-name{font-size:21px; font-weight:700; letter-spacing:-.02em; margin:0}
.sheet-sub{font-size:13px; color:var(--text-2); margin:3px 0 0}
.sheet-score{font-size:44px; font-weight:700; line-height:1; letter-spacing:-.03em; color:var(--tone); text-align:right}
.sheet-score small{display:block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--tone); margin-top:5px}
.closebtn{
  appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--text-2);
  width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:17px; line-height:1; flex:none;
}
.closebtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.sheet-body{padding:20px 22px 24px; display:flex; flex-direction:column; gap:22px}
.sec-title{
  font-size:11.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--text-3);
  font-weight:700; margin:0 0 12px;
}

/* metric rows — 每一項自己判狀態，不吃整體燈號 */
.mgroup + .mgroup{margin-top:22px}
.mgroup-title{
  display:flex; align-items:center; gap:10px; margin:0 0 13px;
  font-size:12.5px; font-weight:700; color:var(--text-2);
}
.mgroup-title::after{content:""; flex:1; height:1px; background:var(--border)}
.metric{display:grid; grid-template-columns:1fr auto; gap:3px 12px; margin-bottom:15px}
.metric:last-child{margin-bottom:0}
.metric-name{font-size:14px; font-weight:600}
.metric-val{font-size:13px; color:var(--text-2); text-align:right; white-space:nowrap}
.metric-val b{color:var(--text); font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.mstat{
  display:inline-block; margin-left:7px; padding:1px 7px; border-radius:999px;
  font-size:11.5px; font-weight:700; font-family:var(--font-mono);
  background:var(--m-bg); color:var(--m);
}
.track{
  grid-column:1/-1; position:relative; height:8px; border-radius:4px;
  background:var(--surface-2); margin-top:4px;
}
.track i{display:block; height:100%; background:var(--m); border-radius:4px}
.track u{
  position:absolute; top:-3px; bottom:-3px; width:2px; border-radius:1px;
  background:var(--text-3); text-decoration:none;
}
.metric-note{grid-column:1/-1; font-size:12.5px; color:var(--text-3); margin-top:4px}
.metric-note b{color:var(--m); font-weight:600}
.is-max {--m:var(--green-line); --m-bg:var(--green-bg)}
.is-part{--m:var(--amber-line); --m-bg:var(--amber-bg)}
.is-zero{--m:var(--red-line);   --m-bg:var(--red-bg)}
.is-lost{--m:var(--grey-line);  --m-bg:var(--grey-bg)}
.is-zero .track{background:var(--red-bg)}

/* 到綠燈的階梯 */
.actions{background:var(--surface-2); border-radius:11px; padding:16px 18px}
.ladder{position:relative; display:flex; flex-direction:column}
.ladder::before{
  content:""; position:absolute; left:11px; top:24px; bottom:24px;
  width:2px; background:var(--border);
}
.rung{
  display:grid; grid-template-columns:24px 1fr auto; gap:13px;
  align-items:center; padding:9px 0;
}
.rung-mark{
  position:relative; z-index:1; width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:12px; font-weight:700;
  background:var(--surface); border:2px solid var(--border); color:var(--text-3);
}
.rung-body{font-size:14px; line-height:1.45}
.rung-body small{display:block; color:var(--text-3); font-size:12.5px}
.rung-after{
  text-align:right; white-space:nowrap; font-size:13px; color:var(--text-2);
  display:flex; align-items:center; gap:7px;
}
.rung-after b{
  font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  font-size:16px; font-weight:700; color:var(--text);
}
.rung-pill{
  font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px;
  background:var(--r-bg); color:var(--r);
}
.rung-now .rung-body{color:var(--text-2)}
.rung-step .rung-mark{background:var(--accent); border-color:var(--accent); color:#fff}
.rung-goal .rung-mark{background:var(--green-line); border-color:var(--green-line); color:#fff}
.rung-goal .rung-after b{color:var(--green-line)}
.r-green{--r:var(--green); --r-bg:var(--green-bg)}
.r-amber{--r:var(--amber); --r-bg:var(--amber-bg)}
.r-red  {--r:var(--red);   --r-bg:var(--red-bg)}
.r-grey {--r:var(--grey);  --r-bg:var(--grey-bg)}
.ladder-note{
  margin:13px 0 0; padding-top:13px; border-top:1px solid var(--border);
  font-size:13px; color:var(--text-2);
}
.ladder-note b{color:var(--text)}
.ok-note{font-size:14px; color:var(--text-2); margin:0}
.note{
  margin-top:12px; font-size:13.5px; color:var(--text-2);
  background:var(--n-bg); border-left:3px solid var(--n-line);
  border-radius:0 8px 8px 0; padding:10px 14px;
}
.note b{color:var(--n-line); font-weight:700}
.note-ok   {--n-bg:var(--green-bg); --n-line:var(--green-line)}
.note-watch{--n-bg:var(--amber-bg); --n-line:var(--amber-line)}
.note-warn {--n-bg:var(--red-bg);   --n-line:var(--red-line)}

/* ---------- watchlist ---------- */
.lists{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px}
.list{background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden}
.list-head{padding:14px 17px; border-bottom:1px solid var(--border)}
.list-head h3{margin:0; font-size:15.5px; font-weight:700; letter-spacing:-.01em}
.list-head p{margin:3px 0 0; font-size:12.5px; color:var(--text-2)}
.list-body{padding:6px 0}
.li{
  display:grid; grid-template-columns:auto 1fr auto; gap:3px 12px; align-items:baseline;
  padding:11px 17px; width:100%;
  background:none; border:0; font:inherit; text-align:left; cursor:pointer; color:var(--text);
}
.li + .li{border-top:1px solid var(--border)}
.li:hover{background:var(--surface-2)}
.li:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.li-score{font-family:var(--font-mono); font-size:14px; font-weight:700; color:var(--tone)}
.li-name{font-size:14.5px; font-weight:650}
.li-tag{
  font-size:12px; font-weight:700; padding:2px 9px; border-radius:999px;
  background:var(--tone-bg); color:var(--tone); white-space:nowrap;
}
.li-how{grid-column:2/-1; font-size:12.5px; color:var(--text-2); line-height:1.5}
.li-how b{color:var(--text); font-weight:600}
.empty{padding:16px 17px; font-size:13.5px; color:var(--text-3)}
.hint{
  grid-column:1/-1; margin:0; padding:44px 24px; text-align:center; line-height:1.9;
  background:var(--surface); border:1px dashed var(--border); border-radius:12px;
}
.hint b{display:block; font-size:15px; font-weight:600; color:var(--text)}
.hint span{font-size:13px; color:var(--text-3)}

/* ---------- rules ---------- */
.rules{display:grid; grid-template-columns:repeat(auto-fit,minmax(272px,1fr)); gap:14px}
.rule{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px}
.rule h3{margin:0 0 2px; font-size:15.5px; font-weight:700; letter-spacing:-.01em}
.rule .sub{margin:0 0 12px; font-size:12.5px; color:var(--text-3)}
.rule table{width:100%; border-collapse:collapse; font-size:13.5px}
.rule td{padding:5px 0; border-bottom:1px solid var(--border)}
.rule tr:last-child td{border-bottom:0}
.rule td:last-child{text-align:right; font-family:var(--font-mono); font-weight:700; font-variant-numeric:tabular-nums}
.rule-foot{
  grid-column:1/-1; font-size:13.5px; color:var(--text-2); background:var(--surface);
  border:1px solid var(--border); border-radius:12px; padding:15px 18px; line-height:1.65;
}
.rule-foot b{color:var(--text)}
.rule-foot code{font-family:var(--font-mono); font-size:12.5px; background:var(--surface-2); padding:1px 5px; border-radius:4px}
.mtable-wrap{overflow-x:auto; margin-top:12px}
.mtable{width:100%; border-collapse:collapse; font-size:13.5px; min-width:340px}
.mtable th{
  text-align:left; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-3); font-weight:700; padding:0 10px 6px 0; border-bottom:1px solid var(--border);
}
.mtable th:nth-child(2), .mtable th:nth-child(3){text-align:right}
.mtable td{padding:6px 10px 6px 0; border-bottom:1px solid var(--border)}
.mtable td.num{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.mtable tbody tr:last-child td{border-bottom:0; font-weight:700}
.mtable tbody tr:last-child td.num{color:var(--text)}
.mdir{width:22px; text-align:center; font-size:11px; color:var(--text-3)}
.mdir.up{color:var(--green-line)}
.mdir.down{color:var(--red-line)}

/* ---------- 怎麼上綠燈分會 ---------- */
.cbox{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:16px}
.cbox h3{margin:0 0 4px; font-size:16px; font-weight:700; letter-spacing:-.01em}
.cbox .sub{margin:0 0 14px; font-size:13px; color:var(--text-2); line-height:1.6}
.cbox .sub b{color:var(--text)}
.ctable-wrap{overflow-x:auto}
.ctable{width:100%; border-collapse:collapse; font-size:13.5px; min-width:520px}
.ctable th{
  text-align:left; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-3); font-weight:700; padding:0 12px 7px 0; border-bottom:1px solid var(--border); white-space:nowrap;
}
.ctable td{padding:9px 12px 9px 0; border-bottom:1px solid var(--border); vertical-align:middle}
.ctable tr:last-child td{border-bottom:0}
.ctable td.n{font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.ctable .verdict{font-size:12px; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap}
.v-good{background:var(--green-bg); color:var(--green)}
.v-mid {background:var(--surface-2); color:var(--text-2)}
.v-bad {background:var(--red-bg); color:var(--red)}
.target{
  display:grid; grid-template-columns:auto 1fr; gap:12px 15px; align-items:start;
  padding:14px 0; border-bottom:1px dashed var(--border);
}
.target:last-of-type{border-bottom:0; padding-bottom:0}
.target-num{
  width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:13px; font-weight:700;
}
.target-h{margin:0 0 3px; font-size:15px; font-weight:700; line-height:1.4}
.target-b{margin:0; font-size:13.5px; color:var(--text-2); line-height:1.6}
.target-b b{color:var(--text)}
.caveat{

<script>
const DATA_URL = 'data.json';

(async () => {
  const app = document.querySelector('.wrap');
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    boot(d.members, d.chapter || {}, d.updatedAt, d.prev || null);
  } catch (e) {
    app.innerHTML = '<p style="padding:40px;text-align:center;color:var(--red)">'
      + '讀不到資料（' + e.message + '）。<br>如果是剛更新完，等 30 秒再重新整理。</p>';
  }
})();

function boot(RAW, CH, updatedAt, PREV) {


/* ---------- 計分規則（照 Excel「評分」分頁還原，57 人逐欄驗證吻合） ---------- */
const TIER = {
  absent : [[0,20],[1,15],[2,10]],                                  // 缺席次數（少者高分）
  ref    : [[0.75,5],[1,10],[1.2,15],[1.5,20]],                     // 每週提供引薦
  vis    : [[1,10],[2,15]],                                         // 每 4 週來賓
  o2o    : [[0.5,5],[1,10],[2,15]],                                 // 每週一對一
  ceu    : [[2,5],[4,10],[6,15]],                                   // 分會教育單位
  tyfcb  : [[400000,5],[800000,10],[2000000,15]]                    // 交易價值
};
const GREEN = 70, AMBER = 50, RED = 30;

/* 分會層級的數字不在會員檔裡，來自 BNI 官方《分會紅綠燈報告》。
   這裡先放 2026-07 的實際值示範，正式版由每月那份分會報告帶入。 */
const CHAPTER = {
  period: '2026 年 7 月',
  score: 65, prevScore: 70,
  gyPct: 30, prevGyPct: 20,
  delta: null,   // 與上一期的燈號人數差，boot 時從 prev 算
  moves: null,   // 會員得分升降人數，boot 時從 prev 算
  /* BNI Accelerate《分會紅綠燈計算方式》官方計分表。
     拿全區 25 分會 × 2 個月共 50 筆驗證，45 筆完全命中，華都更兩個月都分毫不差。 */
  official: [
    {k:'分會大小',              v:57,     unit:'人',   tiers:[[31,15],[26,10],[21,5],[0,0]],
     label:['31 以上','26–30','21–25','20 以下'], note:'月底回報的會員人數'},
    {k:'會員成長（6 個月）',     v:57,     unit:'人',   tiers:[[5,15],[3,10],[1,5],[0,0]],
     label:['5 以上','3–4','1–2','1 以下'], note:'過去 6 個月會員總數的變化'},
    {k:'保留率（12 個月）',      v:0,      unit:'%',    tiers:[[70,15],[60,10],[50.01,5],[0,0]],
     label:['70% 以上','60–69.99%','50.01–59.99%','50% 以下'], note:'入會滿 12 個月的會員裡，還留在 BNI 的比例'},
    {k:'會員每週引薦數（6 個月）',v:0.34,   unit:'件',   tiers:[[1.11,15],[0.91,10],[0.71,5],[0,0]],
     label:['1.11 以上','0.91–1.1','0.71–0.9','0.7 以下'], note:'每位會員每週平均給出的引薦'},
    {k:'每週來賓數（6 個月）',   v:1.77,   unit:'位',   tiers:[[2.01,15],[1.51,10],[1.01,5],[0,0]],
     label:['2.01 以上','1.51–2','1.01–1.5','1 以下'], note:'期間內來賓總數 ÷ 會議次數'},
    {k:'轉換率（6 個月）',       v:247.83, unit:'%',    tiers:[[20.01,10],[10.01,5],[0,0]],
     label:['20.01% 以上','10.01–20%','10% 以下'], note:'6 個月內入會人數 ÷ 參與會議的來賓數'},
    {k:'缺席率（6 個月）',       v:0.84,   unit:'%',    low:1, tiers:[[5,15],[10,10],[12,5],[999,0]],
     label:['少於 5%','5–9.99%','10–11.99%','12% 以上'], note:'越低越好'}
  ],
  metrics: [
    ['分會規模',        '56',     '57',     'up'],
    ['會員增長（6 個月）','56',     '57',     'up'],
    ['保留率 %',        '0',      '0',      'flat'],
    ['引薦數／週',      '0.39',   '0.34',   'down'],
    ['來賓數／週',      '2.38',   '1.77',   'down'],
    ['轉換率 %',        '294.74', '247.83', 'down'],
    ['缺席率 %',        '0.47',   '0.84',   'down'],
    ['分會得分',        '70',     '65',     'down']
  ]
};


/* 線上資料覆蓋分會那七項與月份 */
(() => {
  if (!CH) return;
  if (typeof CH.score === 'number') CHAPTER.score = CH.score;
  if (typeof CH.prevScore === 'number') CHAPTER.prevScore = CH.prevScore;
  if (CH.period) CHAPTER.period = CH.period;
  const MAP = {'分會大小':'size','會員成長':'growth','保留率':'retention',
               '會員每週引薦數':'ref','每週來賓數':'vis','轉換率':'conv','缺席率':'absent'};
  CHAPTER.official.forEach(m => {
    for (const pre in MAP) if (m.k.indexOf(pre) === 0 && typeof CH[MAP[pre]] === 'number') m.v = CH[MAP[pre]];
  });
  const tag = document.querySelector('.demo-tag');
  if (tag && CH.period) tag.textContent = CH.period;
  const r = CH.range || rangeFromPeriod(CH.period);
  if (r) document.querySelectorAll('.period b, .foot-range').forEach(el => el.textContent = r);
})();

function rangeFromPeriod(p){
  const m = /(\d{4})\s*年\s*(\d{1,2})\s*月/.exec(p||'');
  if (!m) return '';
  const y = +m[1], mo = +m[2];
  const end = new Date(Date.UTC(y, mo, 0));            // 該月最後一天
  const start = new Date(Date.UTC(y, mo - 6, 1));      // 往前算 6 個月的第一天
  const f = d => d.toISOString().slice(0,10);
  return f(start) + ' – ' + f(end);
}
const scoreAbsent = a => a===0?20 : a===1?15 : a===2?10 : 0;
const byRate = (val, tiers) => tiers.reduce((s,[t,p]) => val >= t-1e-9 ? p : s, 0);

function scoreOf(m){
  const W = m.weeks || 1;
  return {
    absent: scoreAbsent(m.A),
    ref   : byRate(m.RG / W, TIER.ref),
    vis   : byRate(m.V / W * 4, TIER.vis),
    o2o   : byRate(m.O2O / W, TIER.o2o),
    ceu   : byRate(m.CEU, TIER.ceu),
    tyfcb : byRate(m.TYFCB, TIER.tyfcb)
  };
}
const lightOf = t => t >= GREEN ? 'green' : t >= AMBER ? 'amber' : t >= RED ? 'red' : 'grey';
const LIGHT = {
  green:{name:'綠燈', cls:'tone-green', color:'--green-line'},
  amber:{name:'黃燈', cls:'tone-amber', color:'--amber-line'},
  red  :{name:'紅燈', cls:'tone-red',   color:'--red-line'},
  grey :{name:'黑燈', cls:'tone-grey',  color:'--grey-line'}
};
const nf = n => n.toLocaleString('en-US');

/* ---------- 下一步建議：找出補到綠燈最省力的組合 ---------- */
const COST = {ref:3, vis:14, o2o:2, ceu:1, tyfcb:3};   // 每一單位的相對力氣
function optionsFor(m, sc){
  const W = m.weeks || 1, out = [];
  const push = (key,gain,need,text,detail) => {
    if (gain <= 0 || need <= 0) return;
    out.push({key, gain, need, text, detail, cost: need * COST[key] / gain});
  };
  TIER.ref.forEach(([r,p]) => push('ref', p - sc.ref, Math.ceil(r*W - 1e-9) - m.RG,
    `再給出 N 件引薦`, `目前 ${m.RG} 件，每週 ${(m.RG/W).toFixed(2)} 件`));
  TIER.vis.forEach(([r,p]) => push('vis', p - sc.vis, Math.ceil(r*W/4 - 1e-9) - m.V,
    `再帶 N 位來賓`, `目前 ${m.V} 位`));
  TIER.o2o.forEach(([r,p]) => push('o2o', p - sc.o2o, Math.ceil(r*W - 1e-9) - m.O2O,
    `再約 N 次一對一`, `目前 ${m.O2O} 次，每週 ${(m.O2O/W).toFixed(2)} 次`));
  TIER.ceu.forEach(([t,p]) => push('ceu', p - sc.ceu, t - m.CEU,
    `再上 N 個分會教育單位`, `目前 ${m.CEU} 個`));
  TIER.tyfcb.forEach(([t,p]) => push('tyfcb', p - sc.tyfcb, Math.ceil((t - m.TYFCB)/10000),
    `交易價值再進 N 萬`, `目前 ${nf(m.TYFCB)} 元`));
  return out;
}
function planFor(m, sc, total){
  const need = GREEN - total;
  if (need <= 0) return [];
  const opts = optionsFor(m, sc).sort((a,b) => a.cost - b.cost);
  const picked = [], used = new Set();
  let got = 0;
  for (const o of opts){
    if (got >= need || picked.length >= 3) break;   // 最多給三步，多了沒人做
    if (used.has(o.key)) continue;
    used.add(o.key); picked.push(o); got += o.gain;
  }
  // 收尾：能換成同項目較低一階仍夠用的，就換掉，省力氣
  for (let i = picked.length - 1; i >= 0 && picked.length; i--){
    const p = picked[i];
    const smallestEnough = optionsFor(m, sc)
      .filter(o => o.key === p.key && o.gain < p.gain)
      .sort((a,b) => a.gain - b.gain)
      .find(o => got - p.gain + o.gain >= need);
    if (smallestEnough){
      got = got - p.gain + smallestEnough.gain;
      picked[i] = smallestEnough;
    }
  }
  return picked.map(p => ({...p, text: p.text.replace('N', p.need)}));
}

/* ---------- 組資料 ---------- */
const M = RAW.map(r => {
  const m = {no:r[0], name:r[1], weeks:r[2], P:r[3], A:r[4], L:r[5], Med:r[6], S:r[7],
             RG:r[8], RR:r[9], V:r[10], O2O:r[11], CEU:r[12], TYFCB:r[13]};
  m.sc = scoreOf(m);
  m.total = Object.values(m.sc).reduce((a,b) => a+b, 0);
  m.light = lightOf(m.total);
  m.plan = planFor(m, m.sc, m.total);
  m.attend = Math.round((m.P + m.S) / (m.weeks||1) * 100);
  // 再缺席一次會怎樣
  const nextTotal = m.total - m.sc.absent + scoreAbsent(m.A + 1);
  m.riskDrop = m.total - nextTotal;
  m.riskLight = lightOf(nextTotal);
  m.shortName = m.name.split(/[\s（(]/)[0];
  return m;
}).sort((a,b) => b.total - a.total || a.no - b.no);

/* 週數最多的人＝待滿整個計分區間；比他少代表這半年才入會 */
const FULL_WEEKS = Math.max(...M.map(m => m.weeks));
M.forEach(m => {
  m.isNew = m.weeks < FULL_WEEKS;
  m.zeroCount = Object.values(m.sc).filter(v => v === 0).length;
});

/* 上一期資料：畫面上所有「跟上個月比」的敘述都由這裡算，沒有上一期就不顯示 */
const PREVM = (PREV && Array.isArray(PREV.members)) ? PREV.members : null;
const PREVC = (PREV && PREV.chapter) ? PREV.chapter : null;

function scoreOfRow(row){
  const m = {weeks:row[2], A:row[4], RG:row[8], V:row[10], O2O:row[11], CEU:row[12], TYFCB:row[13]};
  const sc = scoreOf(m);
  return Object.values(sc).reduce((a,b) => a+b, 0);
}

/* ---------- 分布條 ---------- */
const ORDER = ['green','amber','red','grey'];
const counts = Object.fromEntries(ORDER.map(k => [k, M.filter(m => m.light===k).length]));

(() => {
  if (!PREVM) return;
  const prevScores = new Map(PREVM.map(r => [r[0], scoreOfRow(r)]));
  const prevCounts = Object.fromEntries(ORDER.map(k => [k, 0]));
  prevScores.forEach(v => prevCounts[lightOf(v)]++);
  CHAPTER.delta = Object.fromEntries(ORDER.map(k => [k, counts[k] - prevCounts[k]]));
  let up = 0, down = 0, flat = 0, joined = 0;
  M.forEach(m => {
    if (!prevScores.has(m.no)) { joined++; return; }
    const d = m.total - prevScores.get(m.no);
    if (d > 0) up++; else if (d < 0) down++; else flat++;
  });
  CHAPTER.moves = {up, down, flat, joined};
})();
document.getElementById('distBar').innerHTML = ORDER.map(k => {
  const pct = counts[k] / M.length * 100;
  return `<div class="dist-seg" style="width:${pct}%;background:var(${LIGHT[k].color})">${pct >= 9 ? Math.round(pct)+'%' : ''}</div>`;
}).join('');
document.getElementById('distLegend').innerHTML = ORDER.map(k => {
  const d = CHAPTER.delta ? CHAPTER.delta[k] : 0;
  const tail = d === 0 ? '' : ` <span class="num" style="color:var(--text-3)">(${d > 0 ? '+' : ''}${d})</span>`;
  return `<span><i class="dot" style="background:var(${LIGHT[k].color})"></i>${LIGHT[k].name} <b class="num">${counts[k]}</b> 人${tail}</span>`;
}).join('');
const greenPct = Math.round(counts.green / M.length * 100);
const gyPct = Math.round((counts.green + counts.amber) / M.length * 100);
const avg = M.reduce((a,m) => a + m.total, 0) / M.length;
const avgLight = lightOf(avg);
const needGreen = Math.ceil(M.length * 0.6) - counts.green;   // 綠燈目標 60%
const needAmber = M.length - counts.green - counts.amber;     // 綠 60 + 黃 40 = 全員至少黃燈

const chapLight = lightOf(CHAPTER.score);
const chapDiff = CHAPTER.score - CHAPTER.prevScore;
const arrow = d => d > 0 ? `▲ +${d}` : d < 0 ? `▼ ${d}` : '—';

document.getElementById('chapterStats').innerHTML = `
  <div class="stat s-${chapLight}">
    <p class="stat-label">分會得分 · BNI 官方</p>
    <div class="stat-value">${CHAPTER.score}<small>分 · ${LIGHT[chapLight].name}</small></div>
    <p class="stat-note">上月 <b>${CHAPTER.prevScore}</b> 分　${arrow(chapDiff)}</p>
  </div>
  <div class="stat s-green">
    <p class="stat-label">綠燈比例</p>
    <div class="stat-value">${greenPct}<small>% · 目標 60%</small></div>
    <p class="stat-note">距離目標還有 <b>${needGreen}</b> 人</p>
  </div>
  <div class="stat s-amber">
    <p class="stat-label">綠燈加黃燈</p>
    <div class="stat-value">${gyPct}<small>% · 上月 ${CHAPTER.prevGyPct}%</small></div>
    <p class="stat-note">紅燈與黑燈 <b>${needAmber}</b> 人</p>
  </div>`;

document.getElementById('goalNote').innerHTML =
  `分會目標：<b>綠燈 60%、黃燈 40%</b>。目前紅燈與黑燈合計 `+
  `<b class="num">${counts.red + counts.grey}</b> 人。`+
  (CHAPTER.moves
    ? `本月會員得分<b>上升 ${CHAPTER.moves.up} 人、下降 ${CHAPTER.moves.down} 人、`+

/* 每一項的狀態：滿分 / 還能加 / 完全沒分 / 補不回來 */
function metricState(m, def){
  const got = m.sc[def.key];
  const next = optionsFor(m, m.sc)
    .filter(o => o.key === def.key)
    .sort((a,b) => a.gain - b.gain)[0] || null;
  const cls = !next ? (got === def.max ? 'is-max' : 'is-lost')
                    : (got === 0 ? 'is-zero' : 'is-part');
  return {got, next, cls, headroom: next ? def.max - got : 0};
}

function openSheet(name){
  const m = M.find(x => x.name === name); if (!m) return;
  const L = LIGHT[m.light];
  const rows = METRICS.map(def => ({def, st: metricState(m, def)}));
  const canGain = rows.filter(r => r.st.next).sort((a,b) => b.st.headroom - a.st.headroom);
  const settled = rows.filter(r => !r.st.next);

  const drawRow = ({def, st}) => {
    const {got, next, cls} = st;
    const tick = next ? `<u style="left:min(calc(${(got + next.gain) / def.max * 100}% - 1px), calc(100% - 2px))"></u>` : '';
    const badge = next ? `+${next.gain}` : (cls === 'is-max' ? '滿分' : '不可回補');
    const hint = next
      ? `<b>${next.text.replace('N', next.need)} → +${next.gain} 分</b>`
      : (cls === 'is-max' ? '已達最高階' : '缺席分數不可回補');
    return `<div class="metric ${cls}">
      <span class="metric-name">${def.name}</span>
      <span class="metric-val"><b>${got}</b> / ${def.max} 分<em class="mstat">${badge}</em></span>
      <span class="track"><i style="width:${got / def.max * 100}%"></i>${tick}</span>
      <span class="metric-note">${def.cur(m)}　·　${hint}</span>
    </div>`;
  };

  const metrics =
    (canGain.length ? `<div class="mgroup"><p class="mgroup-title">尚有空間 ${canGain.length} 項</p>${canGain.map(drawRow).join('')}</div>` : '') +
    (settled.length ? `<div class="mgroup"><p class="mgroup-title">已達上限</p>${settled.map(drawRow).join('')}</div>` : '');

  const ladder = (() => {
    if (m.total >= GREEN) return `<p class="ok-note">總分 ${m.total} 分，已達綠燈門檻 70 分。</p>`;
    if (!m.plan.length)   return `<p class="ok-note">六項都已達最高階。</p>`;
    let acc = m.total;
    const steps = m.plan.map((p, i) => {
      acc += p.gain;
      const lt = lightOf(acc), reached = lt === 'green';
      return `<div class="rung ${reached ? 'rung-goal' : 'rung-step'} r-${lt}">
        <span class="rung-mark">${reached ? '✓' : i + 1}</span>
        <span class="rung-body">${p.text}<small>${p.detail}</small></span>
        <span class="rung-after"><b>${acc}</b> 分<em class="rung-pill">${LIGHT[lt].name}</em></span>
      </div>`;
    }).join('');
    const done = acc >= GREEN;
    const note = done
      ? `每一項是分開計分的，完成一項就加一次分。`
      : `這 ${m.plan.length} 項全部完成後為 ${acc} 分（${LIGHT[lightOf(acc)].name}）。`;
    return `<div class="ladder">
        <div class="rung rung-now r-${m.light}">
          <span class="rung-mark">●</span>
          <span class="rung-body">目前</span>
          <span class="rung-after"><b>${m.total}</b> 分<em class="rung-pill">${L.name}</em></span>
        </div>${steps}
      </div>
      <p class="ladder-note">${note}</p>`;
  })();

  const risk = (() => {
    if (m.riskDrop <= 0) return '';                       // 已經扣到底，沒有更低了
    const drops = m.riskLight !== m.light;
    if (m.A === 0){                                       // 全勤：是恭喜加提醒，不是警告
      return drops
        ? `<div class="note note-watch">${m.weeks} 週<b>全勤</b>，出席項 20 分（滿分）。
             此區間內每缺席 1 次減 5 分，減分後為${LIGHT[m.riskLight].name}。</div>`
        : `<div class="note note-ok">${m.weeks} 週<b>全勤</b>，出席項 20 分（滿分）。</div>`;
    }
    return `<div class="note note-warn">缺席 <b>${m.A}</b> 次。再缺席 1 次減 ${m.riskDrop} 分`
         + (drops ? `，減分後為${LIGHT[m.riskLight].name}。` : `。`) + `</div>`;
  })();

  document.getElementById('sheet').className = `sheet ${L.cls}`;
  document.getElementById('sheet').innerHTML = `
    <div class="sheet-head">
      <div class="row">
        <div>
          <h2 class="sheet-name" id="sheetName">${m.name}</h2>
          <p class="sheet-sub">會員編號 ${m.no}　·　這段期間計入 ${m.weeks} 週　·　${
            m.A === 0 ? '沒缺席過' : `缺席 ${m.A} 次（出席率 ${m.attend}%）`}</p>
        </div>
        <div style="display:flex; gap:12px; align-items:flex-start">
          <div class="sheet-score num">${m.total}<small>${L.name}</small></div>
          <button class="closebtn" id="closeBtn" aria-label="關閉">×</button>
        </div>
      </div>
    </div>
    <div class="sheet-body">
      <div>
        <p class="sec-title">${m.total >= GREEN ? '目前狀態' : '到綠燈的差距'}</p>
        <div class="actions">${ladder}</div>
        ${risk}
      </div>
      <div>
        <p class="sec-title">六項分數</p>
        ${metrics}
      </div>
    </div>`;
  document.getElementById('overlay').hidden = false;
  document.getElementById('closeBtn').focus();
}

/* ---------- 怎麼上綠燈分會（依 BNI 官方計分表） ---------- */
(() => {
  const O = CHAPTER.official;
  const pts = m => {
    for (const [th, p] of m.tiers) if (m.low ? m.v < th : m.v >= th) return p;
    return 0;
  };
  const maxOf = m => Math.max(...m.tiers.map(t => t[1]));
  const total = O.reduce((a, m) => a + pts(m), 0);
  const ceilingNow = O.reduce((a, m) => a + (m.k.startsWith('保留率') ? 0 : maxOf(m)), 0);

  const rows = O.map(m => {
    const got = pts(m), max = maxOf(m), full = got === max;
    // 下一階：分數比現在高、且最接近的一階
    const up = [...m.tiers].filter(t => t[1] > got).sort((a, b) => a[1] - b[1])[0];
    const cls = full ? 'v-good' : got === 0 ? 'v-bad' : 'v-mid';
    const tag = full ? '滿分' : got === 0 ? '掛零' : `還能 +${up[1] - got}`;
    const idx = m.tiers.findIndex(t => t[1] === got);
    return `<tr>
      <td>${m.k}<div style="font-size:12px;color:var(--text-3);margin-top:1px">${m.note}</div></td>
      <td class="n">${m.v}${m.unit}</td>
      <td>${m.label[idx] || '—'}</td>
      <td class="n"><b>${got}</b> / ${max}</td>
      <td><span class="verdict ${cls}">${tag}</span></td>
    </tr>`;
  }).join('');

  /* ── 以下敘述全部由資料算出，換月份不用改任何文字 ── */
  const W = M[0] ? M[0].weeks : 13;                        // 計分週數
  const N = M.length;                                       // 會員數
  const sumV = M.reduce((a, m) => a + m.V, 0);              // 來賓總數
  const sumRG = M.reduce((a, m) => a + m.RG, 0);            // 引薦總數
  const visWithScore = M.filter(m => m.sc.vis > 0).length;  // 個人端來賓有得分的人數

  // 每一項「升到下一階」要補多少，換算成看得懂的量
  const gaps = O.map(m => {
    const got = pts(m), max = maxOf(m);
    if (got === max) return null;
    const up = [...m.tiers].filter(t => t[1] > got).sort((a, b) => a[1] - b[1])[0];
    if (!up) return null;
    const th = up[0], gain = up[1] - got;
    let need = '';
    if (m.k.indexOf('每週來賓數') === 0) {
      const total = Math.ceil(th * W), now = Math.round(m.v * W);
      need = `6 個月來賓總數需達 <b>${total} 位</b>，目前約 ${now} 位，差 <b>${total - now} 位</b>`;
    } else if (m.k.indexOf('會員每週引薦數') === 0) {
      const total = Math.ceil(th * W * N), diff = total - sumRG;
      need = `6 個月需達 <b>${total} 件</b>，目前 ${sumRG} 件，差 <b>${diff} 件</b>，平均每人 ${(diff / N).toFixed(1)} 件`;
    } else if (m.k.indexOf('保留率') === 0) {
      need = `需達 <b>${th}%</b>`;
    } else {
      need = `需達 <b>${th}${m.unit}</b>（目前 ${m.v}${m.unit}）`;
    }
    return {m, th, gain, need, unit: m.unit};
  }).filter(Boolean);

  // 跟上一期比，是哪幾項造成分數變化
  let changeLine = '';
  if (PREVC) {
    const prevPts = {};
    O.forEach(m => {
      const key = m.k;
      const pv = PREVC[({'分會大小':'size','會員成長':'growth','保留率':'retention',
                         '會員每週引薦數':'ref','每週來賓數':'vis','轉換率':'conv','缺席率':'absent'})[
                        Object.keys({'分會大小':1,'會員成長':1,'保留率':1,'會員每週引薦數':1,
                                     '每週來賓數':1,'轉換率':1,'缺席率':1}).find(k => key.indexOf(k) === 0)]];
      if (typeof pv !== 'number') return;
      const before = (() => { for (const [th, p] of m.tiers) if (m.low ? pv < th : pv >= th) return p; return 0; })();
      if (before !== pts(m)) prevPts[key] = {before, after: pts(m), pv, v: m.v};
    });
    const keys = Object.keys(prevPts);
    if (keys.length) {
      changeLine = '差異來自' + keys.map(k => {
        const c = prevPts[k];
        return `${k.replace(/（.*/, '')}（${c.pv} → ${c.v}，${c.before} 分 → ${c.after} 分）`;
      }).join('、') + '。';
    } else if (typeof PREVC.score === 'number' && PREVC.score === CHAPTER.score) {
      changeLine = '七項得分與上一期相同。';
    }
  }

  // 排序看「離下一階門檻多遠」，不是看能加幾分——保留率從 0 起跳，實務上最遠
  const distance = g => {
    if (g.m.low) return g.m.v <= g.th ? 0 : (g.m.v - g.th) / Math.max(g.m.v, 1);
    return g.th > 0 ? Math.max(0, (g.th - g.m.v) / g.th) : 1;
  };
  gaps.sort((x, y) => distance(x) - distance(y));
  const cheapest = gaps[0];
  const toGreen = GREEN - total;

  document.getElementById('chapterPanel').innerHTML = `
    <div class="cbox">
      <h3>目前與綠燈分會的差距</h3>
      <p class="sub">依 BNI 官方《分會紅綠燈計算方式》七項逐格對出來的：
        華都更 <b>${total} 分</b>，七項中 ${O.filter(m => pts(m) === maxOf(m)).length} 項已達滿分。
        ${PREVC && typeof PREVC.score === 'number'
          ? `上一期 ${PREVC.score} 分，本期 ${CHAPTER.score} 分。${changeLine}` : ''}</p>
      ${toGreen > 0 && cheapest ? `
      <div class="target" style="border-bottom:0;padding-top:4px">
        <span class="target-num" style="background:var(--green-line)">→</span>
        <div>
          <p class="target-h">${cheapest.m.k.replace(/（.*/, '')}達 ${cheapest.th}${cheapest.unit === '%' ? '%' : ' '+cheapest.unit} 以上 → 總分 ${total + cheapest.gain} 分${total + cheapest.gain >= GREEN ? '（綠燈）' : ''}</p>
          <p class="target-b">${cheapest.need}。<br>
            距綠燈門檻 70 分還差 <b>${toGreen} 分</b>，可加分的項目共 ${gaps.length} 項，列於下方。</p>
        </div>
      </div>` : `<p class="ok-note">已達綠燈分會門檻。</p>`}
    </div>

    <div class="cbox">
      <h3>七項逐格對照</h3>
      <div class="ctable-wrap"><table class="ctable">
        <thead><tr><th>官方指標</th><th style="text-align:right">我們的數字</th><th>落在哪一格</th><th style="text-align:right">得分</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <p class="sub" style="margin:14px 0 0">滿分 100 分（轉換率三階、最高 10 分，其餘六項各 15 分）。
        <b>70 分以上為綠燈分會。</b>現階段總分上限 ${ceilingNow} 分。</p>
    </div>

    ${gaps.length ? `
    <div class="cbox">
      <h3>可加分的項目</h3>
      ${gaps.map(g => `
      <div class="target">
        <span class="target-num" style="background:var(--amber-line)">+${g.gain}</span>
        <div>
          <p class="target-h">${g.m.k.replace(/（.*/, '')}：達 ${g.th}${g.unit === '%' ? '%' : ' '+g.unit} 可得 ${pts(g.m) + g.gain} 分</p>
          <p class="target-b">${g.need}。${
            g.m.k.indexOf('保留率') === 0
              ? '<br>分會成立未滿 12 個月，尚無會員符合此項計算條件，本期為 0。'
              : ''}</p>
        </div>
      </div>`).join('')}
    </div>` : ''}

    <div class="cbox">
      <h3>與個人分數的關聯</h3>
      <p class="sub">分會分數與個人分數是兩套算法，但<b>引薦與來賓兩項在兩邊都計分</b>。
        目前全分會 ${W} 週共 ${sumRG} 件引薦、${sumV} 位來賓；
        個人端「帶來賓」有得分的為 ${visWithScore} 人。</p>
    </div>

    <p class="caveat"><b>這頁的計分表是 BNI Accelerate 官方版本。</b>
      拿全區 25 個分會、兩個月共 50 筆實際資料回推驗證，<b>45 筆完全命中</b>，
      華都更 2026-06 的 70 分與 2026-07 的 65 分都逐項對得起來。
      （5 筆對不上的分會差 5～10 分，推測是區報告顯示的數字四捨五入後跨過門檻。）</p>`;
})();

/* ---------- 更新資料 ---------- */
document.getElementById('uploadPanel').innerHTML = `
  <div class="cbox">
    <h3>更新這個月的數字</h3>
    <p class="sub">主席、副主席、導師協調人皆可操作。<b>約 2 分鐘</b>，不需登入或密碼。</p>
    <div class="steps">
      <div class="step"><span class="step-n">1</span><span class="step-t">到 BNI 官方系統下載<b>會員成績表</b><small>不需開啟或修改檔案</small></span></div>
      <div class="step"><span class="step-n">2</span><span class="step-t">在下方選擇該檔<small>畫面會先顯示讀取結果供核對</small></span></div>
      <div class="step"><span class="step-n">3</span><span class="step-t">依《分會紅綠燈報告》填寫七項數字，按更新<small>僅分會七項需手動填寫，會員資料為自動解析</small></span></div>
    </div>
  </div>

  <div class="drop" id="dropZone">
    <div class="drop-icon">📄</div>
    <h3>選擇會員成績表</h3>
    <p>就是 BNI 下載的那個 Excel 檔（.xlsx），也可以直接把檔案拖進這個框</p>
    <div class="drop-row">
      <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
      <button class="btn ghost" id="pickFile">選擇檔案</button>
    </div>
    <p class="fake" id="fileMsg">還沒選檔案</p>
  </div>

  <div class="cbox" id="previewBox" hidden>
    <h3>讀到的內容</h3>
    <div id="previewBody"></div>
  </div>

  <div class="cbox" id="chapterBox" hidden>
    <h3>分會那七項（照《分會紅綠燈報告》抄）</h3>
    <p class="sub">這七項不在會員成績表內，需依分會報告填寫。欄位預帶上次的數值。</p>
    <div class="fgrid" id="chapterForm"></div>
    <div class="drop-row" style="margin-top:18px; justify-content:flex-start">
      <input class="pw" id="uploaderName" placeholder="你的名字（選填）" aria-label="上傳者姓名" style="width:190px">

    </div>
    <p class="fake" id="uploadMsg" hidden></p>
  </div>
`;

/* ---------- 上傳流程 ---------- */
const API = 'https://htl-api.vercel.app/api/upload';
const CH_FIELDS = [
  {k:'score',      label:'分會得分',        hint:'本月'},
  {k:'prevScore',  label:'分會得分（上月）', hint:'上個月的分數'},
  {k:'size',       label:'分會大小',        hint:'月底回報的會員人數'},
  {k:'growth',     label:'會員成長 6 個月',  hint:'過去 6 個月的變化'},
  {k:'retention',  label:'保留率 %',        hint:'12 個月'},
  {k:'ref',        label:'每週引薦數',      hint:'每位會員每週'},
  {k:'vis',        label:'每週來賓數',      hint:'全分會每週'},
  {k:'conv',       label:'轉換率 %',        hint:'6 個月'},
  {k:'absent',     label:'缺席率 %',        hint:'越低越好'}
];
let parsedMembers = null;
let pendingPeriod = null;
let pendingRange = null;
let periodSource = '';

// 從成績表檔名抓計分月份，例如「…(2026-08).xlsx」「…2026年8月…」；抓不到就回上一個月
function periodFromFilename(name){
  let m = /(20\d{2})[-_./年\s]*(\d{1,2})\s*月?/.exec(name || '');
  if (m) {
    const mo = +m[2];
    if (mo >= 1 && mo <= 12) return +m[1] + ' 年 ' + mo + ' 月';
  }
  const d = new Date();
  d.setDate(1); d.setMonth(d.getMonth() - 1);
  return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月';
}

(() => {
  const cur = {score: CHAPTER.score, prevScore: CHAPTER.prevScore};
  const MAP = {'分會大小':'size','會員成長':'growth','保留率':'retention',
               '會員每週引薦數':'ref','每週來賓數':'vis','轉換率':'conv','缺席率':'absent'};
  CHAPTER.official.forEach(m => { for (const pre in MAP) if (m.k.indexOf(pre) === 0) cur[MAP[pre]] = m.v; });
  document.getElementById('chapterForm').innerHTML = CH_FIELDS.map(f =>
    '<label class="fitem"><span class="flabel">' + f.label + '<small>' + f.hint + '</small></span>'
    + '<input class="finput" type="number" step="any" id="ch-' + f.k + '" value="' + cur[f.k] + '"></label>').join('');
})();

function loadSheetJS(){
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, bad) => {
    const el = document.createElement('script');
    el.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    el.onload = ok;
    el.onerror = () => bad(new Error('讀取解析工具失敗，請檢查網路'));
    document.head.appendChild(el);
  });
}

const num = v => (typeof v === 'number' && isFinite(v)) ? v : 0;

function parseWorkbook(wb){
  const name = wb.SheetNames.find(n => /traffic|紅綠燈/i.test(n)) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, defval: null, raw: true});
  const out = [];
  for (const r of rows){
    if (!r) continue;
    const no = r[0], nm = r[1];
    if (typeof no !== 'number' || !nm || typeof nm !== 'string' || !nm.trim()) continue;
    out.push([no, nm.trim(), num(r[3]), num(r[12]), num(r[13]), num(r[14]), num(r[15]), num(r[16]),
              num(r[17]), num(r[18]), num(r[19]), num(r[20]), num(r[21]), num(r[22])]);
  }
  return {sheet: name, members: out, range: findRangeInRows(rows)};
}

// 成績表表頭有「2026-03-01 - 2026-08-31 (6個月)」這行，優先採用它
function findRangeInRows(rows){
  for (let i = 0; i < Math.min(rows.length, 12); i++){
    const r = rows[i]; if (!r) continue;
    for (const cell of r){
      if (typeof cell !== 'string') continue;
      const m = /(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})\s*[-–~至]\s*(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(cell);
      if (m) return {start: pad(m[1],m[2],m[3]), end: pad(m[4],m[5],m[6]),
                     endYear: +m[4], endMonth: +m[5]};
    }
  }
  return null;
}
function pad(y,m,d){ return y + '-' + String(+m).padStart(2,'0') + '-' + String(+d).padStart(2,'0'); }

async function handleFile(file){
  const msg = document.getElementById('fileMsg');
  msg.textContent = '讀取中…';
  try {
    await loadSheetJS();
    const buf = await file.arrayBuffer();
    const parsed = parseWorkbook(XLSX.read(buf, {type: 'array'}));
    const members = parsed.members;
    if (members.length < 10) throw new Error('只讀到 ' + members.length + ' 位會員，這可能不是會員成績表');
    parsedMembers = members;
    if (parsed.range){
      pendingPeriod = parsed.range.endYear + ' 年 ' + parsed.range.endMonth + ' 月';
      pendingRange  = parsed.range.start + ' – ' + parsed.range.end;
      periodSource  = '成績表內的計分期間';
    } else {
      pendingPeriod = periodFromFilename(file.name);
      pendingRange  = rangeFromPeriod(pendingPeriod);
      periodSource  = /20\d{2}/.test(file.name) ? '檔名' : '推算（檔名沒有月份，帶上一個月）';
    }
    msg.textContent = '已讀取 ' + file.name;

    const top = members.slice(0, 3).map(m => m[1].split(/[\s（(]/)[0] + '（第 ' + m[0] + ' 位）').join('、');
    document.getElementById('previewBody').innerHTML =
      '<p class="target-b" style="margin:0 0 12px">從「' + parsed.sheet + '」分頁讀到 <b>'
      + members.length + ' 位會員</b>，計分週數 <b>' + members[0][2] + ' 週</b>。<br>前三位是：'
      + top + '。<br>計分月份：<b>' + pendingPeriod + '</b>　計分期間 <b>' + pendingRange + '</b>'
      + '<br><span style="color:var(--text-2)">（月份取自' + periodSource + '）</span>'
      + '<br>核對無誤後，於下方填寫七項數字並按更新。</p>';
    document.getElementById('previewBox').hidden = false;
    document.getElementById('chapterBox').hidden = false;
    document.getElementById('chapterBox').scrollIntoView({behavior: 'smooth', block: 'start'});
  } catch (e) {
    parsedMembers = null;
    pendingPeriod = null; pendingRange = null; periodSource = '';
    msg.textContent = '讀不到：' + e.message;
    document.getElementById('previewBox').hidden = true;
    document.getElementById('chapterBox').hidden = true;
  }
}

document.getElementById('pickFile').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
const dz = document.getElementById('dropZone');
['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.style.borderColor = 'var(--accent)'; }));
['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.style.borderColor = ''; }));
dz.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });

document.getElementById('doUpload').addEventListener('click', async () => {
  const btn = document.getElementById('doUpload');
  const msg = document.getElementById('uploadMsg');
  msg.hidden = false;
  if (!parsedMembers) { msg.textContent = '還沒選檔案。'; return; }
  const chapter = {};
  for (const f of CH_FIELDS){
    const v = parseFloat(document.getElementById('ch-' + f.k).value);
    if (!isFinite(v)) { msg.textContent = '「' + f.label + '」沒有填數字。'; return; }
    chapter[f.k] = v;
  }
  chapter.period = pendingPeriod || CHAPTER.period;
  if (pendingRange) chapter.range = pendingRange;
  btn.disabled = true; btn.textContent = '更新中…';
  msg.textContent = '正在寫入，請不要關掉這一頁…';
  try {
    const r = await fetch(API, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({members: parsedMembers, chapter,
                            uploadedBy: document.getElementById('uploaderName').value.trim()})
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '未知錯誤');
    msg.innerHTML = '✅ ' + d.message + '<br>這一頁 30 秒後重新整理就會看到新的數字。';
    btn.textContent = '已更新';
  } catch (e) {
    msg.textContent = '更新失敗：' + e.message + '　資料沒有被改動，可以再試一次。';
    btn.disabled = false; btn.textContent = '確認更新';
  }
});

document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x => {
    const on = x === t;
    x.setAttribute('aria-selected', on);
    document.getElementById(x.getAttribute('aria-controls')).hidden = !on;
  });
});

}
</script>
