<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在啟動服務｜華都更追綠光</title>
<meta name="robots" content="noindex">
<link rel="icon" href="./favicon.ico">
<style>
:root{color-scheme:light dark;--bg:#f4f8f5;--card:#fff;--ink:#17231c;--muted:#53675a;--line:#dbe6de;--green:#107b39;--soft:#e3f6ea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}
main{width:min(100%,480px);padding:36px 28px;background:var(--card);border:1px solid var(--line);border-radius:24px;text-align:center;box-shadow:0 12px 36px #12351a0a}
.org{font-size:14px;letter-spacing:.16em;color:var(--muted);margin:0}h1{font-size:30px;margin:4px 0 24px}h1 span{color:var(--green)}h2{font-size:22px;margin:22px 0 10px}p{margin:10px 0}.hint{color:var(--muted);font-size:15px}.status{background:var(--soft);border-radius:12px;padding:12px;margin-top:24px;font-size:15px}
.spinner{width:50px;height:50px;border:4px solid var(--line);border-top-color:var(--green);border-radius:50%;margin:auto;animation:turn 1.2s linear infinite}button,a{font:inherit}button{border:0;border-radius:12px;background:var(--green);color:#fff;padding:12px 22px;cursor:pointer;width:100%;margin-top:18px}a{color:var(--green)}[hidden]{display:none!important}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none;border-style:dotted}}
@media(prefers-color-scheme:dark){:root{--bg:#0d1510;--card:#16211a;--ink:#e8f1eb;--muted:#b0c1b5;--line:#3d5444;--green:#7be59e;--soft:#173524}button{color:#102a18}}
</style>
</head>
<body>
<main>
<p class="org">BNI 華都更分會</p>
<h1>追<span>綠光</span></h1>
<div class="spinner" id="spinner" aria-hidden="true"></div>
<h2 id="heading">小追正在準備中 🌱</h2>
<p>服務需要一點點時間啟動，<br>請稍候，準備好就會自動帶你進入。</p>
<p class="hint">不用一直重新整理，讓小追暖身一下。</p>
<p class="status" id="status" role="status" aria-live="polite">正在喚醒追綠光服務…</p>
<button id="retry" type="button" hidden>再試一次</button>
<noscript><p>請啟用 JavaScript，或<a href="https://hua-greenlight-umydisxveq-de.a.run.app">直接開啟追綠光</a>。</p></noscript>
</main>
<script>
(() => {
  const app = new URL("https://hua-greenlight-umydisxveq-de.a.run.app");
  app.search = location.search;
  app.hash = location.hash;
  const status = document.getElementById('status');
  const retry = document.getElementById('retry');
  const spinner = document.getElementById('spinner');
  const heading = document.getElementById('heading');
  let running = false;
  const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
  // A fresh, decoded image response proves the application is serving requests.
  // Opaque no-cors fetch responses cannot distinguish HTTP 429 from success.
  function probe() {
    return new Promise(resolve => {
      const image = new Image();
      const timer = setTimeout(() => finish(false), 12000);
      function finish(ok) {
        clearTimeout(timer);
        image.onload = image.onerror = null;
        if (!ok) image.src = '';
        resolve(ok);
      }
      image.onload = () => finish(image.naturalWidth > 0);
      image.onerror = () => finish(false);
      image.referrerPolicy = 'no-referrer';
      const url = new URL('/favicon.ico', app);
      url.searchParams.set('startup', `${Date.now()}-${Math.random()}`);
      image.src = url.href;
    });
  }
  async function start() {
    if (running) return;
    running = true;
    retry.hidden = true;
    spinner.hidden = false;
    heading.textContent = '小追正在準備中 🌱';
    status.textContent = '正在喚醒追綠光服務…';
    const started = Date.now();
    while (Date.now() - started < 90000) {
      if (await probe()) {
        heading.textContent = '準備好了！';
        status.textContent = '服務已啟動，正在帶你進入追綠光…';
        await delay(Math.max(600, 1800 - (Date.now() - started)));
        location.replace(app.href);
        return;
      }
      status.textContent = '服務還在暖身，正在自動重新連線，請稍候…';
      await delay(3000);
    }
    running = false;
    spinner.hidden = true;
    heading.textContent = '這次暖身比較久';
    status.textContent = '目前還無法連上服務，請稍後按「再試一次」。';
    retry.hidden = false;
  }
  retry.addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
