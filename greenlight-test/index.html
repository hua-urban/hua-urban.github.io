<link rel="stylesheet" href="./bni-connect.css">
<style>
  :root {
    --bg: #f4f8f5;
    --card: #ffffff;
    --ink: #17231c;
    --muted: #5d6f64;
    --line: #dbe6de;
    --green: #107b39;
    --green-deep: #0b6630;
    --green-soft: #e3f6ea;
    --amber: #f59e0b;
    --red: #b42318;
    --red-soft: #fdecec;
    --off: #cfd8d2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1510; --card: #16211a; --ink: #e8f1eb; --muted: #9bb0a2;
      --line: #3d5444; --green: #126b35; --green-deep: #7be59e; --green-soft: #173524;
      --red: #ff8a80; --red-soft: #3a1c1c; --off: #2c3b31;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1510; --card: #16211a; --ink: #e8f1eb; --muted: #9bb0a2;
    --line: #3d5444; --green: #126b35; --green-deep: #7be59e; --green-soft: #173524;
    --red: #ff8a80; --red-soft: #3a1c1c; --off: #2c3b31;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--green-deep); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 96px; }
  .quick-nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0 0 12px; }
  .quick-nav a { min-height: 48px; padding: 10px; justify-content: center; text-align: center; line-height: 1.35; }

  header { text-align: center; padding: 8px 0 20px; }
  .light {
    display: inline-flex; gap: 10px; padding: 10px 14px; border-radius: 999px;
    background: #1d2621; margin-bottom: 14px;
  }
  .light i { width: 22px; height: 22px; border-radius: 50%; background: #3a4640; transition: .4s; }
  .light.red i:nth-child(1) { background: var(--red); box-shadow: 0 0 12px var(--red); }
  .light.amber i:nth-child(2) { background: var(--amber); box-shadow: 0 0 12px var(--amber); }
  .light.green i:nth-child(3) { background: #22c55e; box-shadow: 0 0 18px #22c55e; }
  .org { font-size: 13px; letter-spacing: .15em; color: var(--muted); margin: 0; }
  h1 { font-size: 30px; margin: 2px 0 12px; letter-spacing: .04em; }
  h1 span { color: var(--green-deep); }
  .lyrics { margin: 0; color: var(--muted); font-size: 15px; font-style: italic; }
  .lyrics b { color: var(--green-deep); font-style: normal; }

  .progress { height: 6px; background: var(--off); border-radius: 99px; overflow: hidden; margin: 8px 0 18px; }
  .progress div { height: 100%; width: 0; background: var(--green); transition: width .35s; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 22px 18px; box-shadow: 0 6px 24px rgba(0,0,0,.05);
    animation: in .3s ease;
  }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  .step { font-size: 13px; color: var(--green-deep); font-weight: 600; margin: 0 0 4px; }
  .q { font-size: 21px; font-weight: 700; margin: 0 0 6px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .me-tag { display: inline-block; margin-bottom: 10px; padding: 3px 10px; border-radius: 99px;
    background: var(--green-soft); color: var(--green-deep); font-size: 13px; font-weight: 600; }
  .who-group { margin: 16px 0 8px; font-size: 16px; color: var(--ink); }
  .who-roster-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .who-roster-head .who-group { margin: 0; }
  .who-roster-toggle { min-height: 48px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; text-align: left; }
  .who-roster-toggle::after { content: " ▾"; }
  .who-roster-toggle[aria-expanded="true"]::after { content: " ▴"; }
  .who-external-switch { display: flex; align-items: center; gap: 8px; min-height: 48px; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .who-external-switch input { width: 20px; height: 20px; accent-color: var(--green-deep); }
  .who-roster-toggle:focus-visible, .who-external-switch input:focus-visible { outline: 3px solid var(--green-deep); outline-offset: 3px; }
  .who-saved-members summary { padding: 12px 0; color: var(--ink); font-weight: 700; cursor: pointer; }
  .ref-chapter-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .ref-chapter-heading .who-group { margin: 0; }
  .ref-member-list > summary { padding: 14px 0; color: var(--ink); font-weight: 700; cursor: pointer; }
  .ref-member-list > summary:focus-visible { outline: 3px solid var(--green-deep); outline-offset: 3px; }
  .ref-member-list > summary span { margin-left: 8px; font-size: 14px; color: var(--green-deep); }
  .ref-total-count { margin-top: 16px; text-align: center; }
  .who-other { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .who-error { color: var(--red); font-weight: 600; margin: 6px 0 0; }

  .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  .yn button {
    padding: 18px 0; font-size: 19px; font-weight: 700; border-radius: 14px;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
  }
  .yn button.yes { border-color: var(--green); color: var(--green-deep); }
  .yn button:active { transform: scale(.98); }

  .tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
  .tools input {
    flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font: inherit; margin-right: 10px;
  }
  .count { color: var(--green-deep); font-weight: 700; white-space: nowrap; }
  .list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .list.one { grid-template-columns: 1fr; }
  .list label, .row {
    display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px;
    border: 1px solid var(--line); cursor: pointer; font-size: 15px; user-select: none;
    min-width: 0;
  }
  .list label.on, .row.on { background: var(--green-soft); border-color: var(--green); }
  .list input[type=checkbox], .list input[type=radio] { accent-color: var(--green); width: 18px; height: 18px; flex: none; margin: 0; }
  .no { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .en { color: var(--muted); font-size: 13px; }

  /* 121 清單：每一列勾選後展開日期與交流方式 */
  .row { display: block; cursor: default; }
  .row > label { display: flex; align-items: flex-start; gap: 10px; padding: 0; border: 0; background: none; cursor: pointer; }
  .row > label input { margin-top: 3px; }
  .row .who { min-width: 0; }
  .row .job { display: block; color: var(--muted); font-size: 13px; }
  .row .detail { display: none; margin: 10px 0 2px 28px; }
  .row.on .detail { display: block; }
  .row.bad { border-color: var(--red); background: var(--red-soft); }
  .date { display: flex; align-items: center; gap: 6px; font-size: 15px; flex-wrap: wrap; }
  .date input:not([type="date"]) {
    width: 3.2em; padding: 7px 6px; text-align: center; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: inherit; font-size: 16px;
  }
  .date label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  .date input[type="date"] {
    width: auto; min-width: 9.5em; min-height: 44px; padding: 6px 8px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 16px;
  }
  .date-manual { white-space: nowrap; }
  .date-calendar { white-space: nowrap; }
  .kinds { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .kinds button {
    padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 14px;
  }
  .kinds button.sel { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }

  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .primary {
    flex: 1; padding: 15px; border: 0; border-radius: 14px; font-size: 17px; font-weight: 700;
    background: var(--green); color: #fff;
  }
  .ghost { padding: 15px 18px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
  a.ghost { display: inline-flex; align-items: center; text-decoration: none; }
  .sticky { position: sticky; bottom: 12px; background: var(--card); padding-top: 8px; }

  .summary h3 { font-size: 15px; margin: 18px 0 8px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 11px; border-radius: 99px; background: var(--green-soft); color: var(--green-deep); font-size: 14px; }
  .chip small { color: var(--muted); margin-left: 4px; }
  .chip-clear { margin-left: 7px; padding: 2px 7px; border: 1px solid var(--green-deep); border-radius: 99px;
    background: transparent; color: var(--green-deep); font-size: 13px; font-weight: 700; }
  .big { font-size: 44px; font-weight: 800; color: var(--green-deep); line-height: 1; margin: 6px 0 0; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px;
    font-size: 14px; opacity: 0; transition: .3s; pointer-events: none; z-index: 5;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }

  /* 我的燈號（資料來自本分會紅綠燈網站） */
  .score-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
    margin: -22px -18px 18px; padding: 20px 18px 16px; border-radius: 18px 18px 0 0; border-bottom: 1px solid var(--line); }
  .score-head h2 { margin: 0; font-size: 24px; }
  .score-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .score-num { text-align: center; font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
  .score-num small { display: block; font-size: 14px; font-weight: 700; margin-top: 4px; }
  .t-green { --tone: #087137; --tone-bg: #e3f6ea; }
  .t-amber { --tone: #885200; --tone-bg: #fbf1dc; }
  .t-red   { --tone: #b3412f; --tone-bg: #f6e3e0; }
  .t-grey  { --tone: #555f59; --tone-bg: #e7ebe8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .t-green { --tone: #4ade80; --tone-bg: #173524; }
    :root:not([data-theme="light"]) .t-amber { --tone: #f5b94a; --tone-bg: #3a2e14; }
    :root:not([data-theme="light"]) .t-red   { --tone: #f08a78; --tone-bg: #3a1c1c; }
    :root:not([data-theme="light"]) .t-grey  { --tone: #b4c0b8; --tone-bg: #25302a; }
  }
  .score-head.t-green, .score-head.t-amber, .score-head.t-red, .score-head.t-grey { background: var(--tone-bg); }
  .score-num { color: var(--tone); }
  .sec { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin: 0 0 10px; }
  .goal { background: var(--bg); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .goal-name { font-weight: 700; }
  .goal-gap { color: var(--red); font-size: 15px; white-space: nowrap; }
  .goal-gap b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .goal.met .goal-gap { color: var(--green-deep); font-weight: 700; }
  .goal-num { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
  .goal-num b { color: var(--ink); font-size: 20px; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 99px; background: var(--off); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; }
  .note { font-size: 14px; color: var(--muted); margin: 12px 0 0; }
  .src { font-size: 12px; color: var(--muted); margin: 14px 0 0; }
  .src a { color: inherit; }
  .entry { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .entry.bad { border-color: var(--red); background: var(--red-soft); }
  .entry-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .entry-n { font-size: 13px; font-weight: 700; color: var(--green-deep); }
  .del { border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; padding: 0 4px; }
  .field { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 15px; white-space: nowrap; }
  .field span { width: 4.2em; flex: none; }
  .referral-person-field { display: grid; grid-template-columns: max-content minmax(0, 12rem) max-content; justify-content: start; gap: 8px; min-width: 0; }
  .referral-person-field .field-name { width: auto; min-width: 0; padding: 0; border: 0; border-radius: 0; background: none; white-space: nowrap; cursor: default; user-select: text; }
  .field.referral-person-field > input { width: 100%; max-width: 100%; min-width: 0; min-height: 44px; border-color: var(--muted); }
  .referral-person-field .self-check { display: inline-flex; align-items: center; gap: 5px; flex: none; min-height: 44px; padding: 0; border: 0; border-radius: 0; background: none; cursor: pointer; color: var(--ink); font-weight: 600; white-space: nowrap; }
  .referral-person-field .self-check input[type="checkbox"] { accent-color: var(--green); width: 18px; height: 18px; flex: none; margin: 0; padding: 0; }
  .field input {
    flex: 1; min-width: 0; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: inherit; font-size: 16px;
  }
  .field input::placeholder, .field textarea::placeholder { color: var(--muted); opacity: 1; }
  .kinds-label { font-size: 15px; align-self: center; margin-right: 2px; }
  .add { width: 100%; padding: 12px; border-radius: 14px; border: 2px dashed var(--green); background: transparent;
    color: var(--green-deep); font-weight: 700; font-size: 16px; }
  .ref-row .row-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .plus { flex: none; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--green); background: var(--card);
    color: var(--green-deep); font-weight: 700; font-size: 14px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--green); color: #fff; vertical-align: 2px; }
  .ref { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  .ref.bad { border-color: var(--red); background: var(--red-soft); }
  .ref-validation { margin: 0 0 10px; color: var(--red); font-size: 14px; white-space: normal; overflow-wrap: anywhere; }
  .ref [data-f][aria-invalid="true"] { border-color: var(--red); }
  .list .ref .field { border: 0; padding: 0; border-radius: 0; background: none; cursor: default; user-select: auto; }
  .field.col { flex-direction: column; align-items: stretch; gap: 4px; white-space: normal; }
  .field.col span { width: auto; }
  .field textarea { padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font: inherit; font-size: 16px; resize: vertical; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
  .seg-label { font-size: 15px; width: 4.2em; }
  .seg button { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; }
  .seg button.sel { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
  .add.small { margin-top: 10px; padding: 9px; font-size: 14px; border-width: 1.5px; }
  .bigs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .bigs > .draft-summary-toggle { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--green-soft); border: 1px solid var(--green-deep); border-radius: 14px; padding: 14px; color: var(--green-deep); font: inherit; cursor: pointer; }
  .draft-summary-toggle:focus-visible { outline: 3px solid var(--green-deep); outline-offset: 3px; }
  .draft-summary-toggle[aria-expanded="true"] { box-shadow: inset 0 0 0 2px var(--green-deep); }
  .draft-summary-toggle:disabled { cursor: default; border-color: var(--line); }
  .draft-summary-toggle .draft-count-number { font-size: 44px; color: var(--green-deep); font-weight: 800; }
  .draft-toggle-hint { font-size: 13px; color: var(--green-deep); }
  .draft-summary-toggle[aria-expanded="true"] .draft-toggle-hint::after { content: " ▴"; }
  .draft-summary-toggle[aria-expanded="false"] .draft-toggle-hint::after { content: " ▾"; }
  .big span { font-size: 18px; color: var(--muted); font-weight: 600; }
  .big-l { margin: 4px 0 0; color: var(--green-deep); font-weight: 700; }
  .part { font-size: 18px; margin: 24px 0 0; padding-top: 16px; border-top: 1px solid var(--line); }
  .sent { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  .sent.ok { color: var(--green-deep); font-weight: 600; }
  .sent.fail { color: var(--red); }
  .connect { margin-top: 14px; }
  .hub { display: grid; gap: 10px; margin-top: 4px; }
  .hubbtn { display: grid; grid-template-columns: 1fr auto; align-items: center; text-align: left; padding: 14px 16px;
    border-radius: 14px; border: 2px solid var(--green); background: var(--card); color: var(--ink); }
  .hubbtn .ht { font-size: 17px; font-weight: 700; }
  .hubbtn .hs { grid-column: 1; font-size: 13px; color: var(--muted); }
  .hubbtn .hg { grid-column: 2; grid-row: 1 / span 2; font-size: 20px; color: var(--green-deep); font-weight: 800; }
  .hubbtn.done { background: var(--green-soft); }
  .hubbtn.done .hs { color: var(--green-deep); font-weight: 600; }
  .entry.gather { padding-bottom: 14px; }
  .gh { font-size: 14px; font-weight: 700; color: var(--green-deep); margin: 12px 0 6px; }
  .gq { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); font: inherit; font-size: 15px; margin-bottom: 8px; }
  .glist { max-height: 300px; overflow: auto; }
  .bulk { margin: 8px 0 4px; }
  .bulk summary { cursor: pointer; font-size: 14px; color: var(--green-deep); font-weight: 600; padding: 4px 0; }
  .bulk textarea { width: 100%; min-height: 110px; margin: 6px 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: inherit; font-size: 16px; resize: vertical; }
  .gout { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin-bottom: 6px; }
  .gout input { min-width: 0; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font: inherit; font-size: 16px; }
  .foot { text-align: center; margin-top: 28px; font-size: 13px; }
  .foot a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); }
  .portal-h { font-weight: 700; margin: 18px 0 10px; }
  .video { margin: 14px 0 4px; }
  .video-h { font-weight: 700; margin: 0 0 8px; }
  .video-box { position: relative; padding-top: 56.25%; border-radius: 12px; overflow: hidden; background: #000; }
  .video-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video-l { margin: 6px 0 0; font-size: 13px; text-align: right; }
  .video-l a, .vlink a { color: var(--green-deep); }
  .vlink { margin: -4px 0 12px; font-size: 15px; font-weight: 600; }
  .portal-h.first { margin-top: 0; font-size: 18px; }
  .portals { display: grid; gap: 20px; }
  .home-functions { display: grid; gap: 24px; margin: 18px 0 28px; }
  .home-functions .training-real { margin-top: 0; }
  .portal { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 16px 18px; border-radius: 16px;
    background: var(--green); color: #fff; text-decoration: none; box-shadow: 0 4px 14px rgba(22,163,74,.3); }
  .portal:active { transform: scale(.99); }
  .portal .pt { font-size: 19px; font-weight: 800; }

<script>
// ═══════════ 分會設定：複製給其他分會時，只要改這一段 ═══════════
const CHAPTER = "華都更";                                    // 分會名稱（不含「分會」兩字）
const SB_URL = "";   // 尚未設定後台連線
const SB_KEY = "";
const OFFICIAL_DATA_ROOT = "https://hua-urban.com/greenlight-test";
const ROSTER_DATA = `${OFFICIAL_DATA_ROOT}/defaults.json`;
const LIGHT_DATA = `${OFFICIAL_DATA_ROOT}/palms.json`;
const LIGHT_SITE = "https://hua-urban.com/traffic-light/?v=est";
const GUIDE_PDF = "";                   // BNI Connect 教學講義；沒有就設成 ""
const VIDEO_URL = "";            // 第一頁的教學影片（YouTube）；沒有就設成 ""
// ══════════════════════════════════════════════════════════════
document.title = `${CHAPTER} 追綠光`;
document.getElementById("orgName").textContent = `BNI ${CHAPTER}分會`;

// 成員與活動每週由官方網站同步至公開測試資料；本機 JSON 只作網路故障時的備援。
const ROSTER = new Map();
const EXTERNAL_MEMBERS_KEY = "hua-urban-greenlight-external-members-v1";
const EXTERNAL_MEMBERS = new Map();
const identityText = value => String(value || "").normalize("NFKC").trim().replace(/\s+/g, " ");
const chapterKey = value => {
  const key = identityText(value).replace(/^BNI\s*/i, "").replace(/\s+/g, "").replace(/分會$/, "").toLocaleLowerCase();
  return { "華都更huaurban+": "華都更", "華地產huarealestate": "華地產" }[key] || key;
};
const memberNameKey = value => {
  let name = identityText(value).toLocaleLowerCase();
  let previous;
  do { previous = name; name = name.replace(/\([^()]*\)/gu, ""); } while (name !== previous);
  if (/[()]/u.test(name)) return "";
  const han = (name.match(/\p{Script=Han}/gu) || []).join("");
  return han || name.replace(/\s+/gu, "");
};
const externalMemberKey = (name, chapter) => `ext:${encodeURIComponent(chapterKey(chapter))}:${encodeURIComponent(memberNameKey(name))}`;
const samePerson = (aName, aChapter, bName, bChapter) => !!memberNameKey(aName) && !!chapterKey(aChapter)
  && memberNameKey(aName) === memberNameKey(bName) && chapterKey(aChapter) === chapterKey(bChapter);
function readExternalMembers() {
  try {
    const saved = JSON.parse(localStorage.getItem(EXTERNAL_MEMBERS_KEY) || "{}");
    if (!saved || typeof saved !== "object" || Array.isArray(saved)) return;
    for (const [id, value] of Object.entries(saved)) {
      if (!value || !memberNameKey(value.name) || !chapterKey(value.chapter)) continue;
      if (id !== externalMemberKey(value.name, value.chapter)) continue;
      EXTERNAL_MEMBERS.set(id, { no: id, name: identityText(value.name), chapter: identityText(value.chapter), ext: true });
    }
  } catch {}
}
function rememberExternalMember(name, chapter) {
  const person = { no: externalMemberKey(name, chapter), name: identityText(name), chapter: identityText(chapter), ext: true };
  EXTERNAL_MEMBERS.set(person.no, person);
  try { localStorage.setItem(EXTERNAL_MEMBERS_KEY, JSON.stringify(Object.fromEntries(EXTERNAL_MEMBERS))); } catch {}
  return person;
}
function personFor(id, actor = null) {
  const rosterMember = ROSTER.get(id);
  if (rosterMember) return { ...rosterMember, chapter: CHAPTER, ext: false };
  if (EXTERNAL_MEMBERS.has(id)) return EXTERNAL_MEMBERS.get(id);
  if (actor?.ext && actor.no === id && externalMemberKey(actor.name, actor.chapter) === id) return actor;
  return null;
}
const currentPerson = () => personFor(state.me, state.actor);
const isSelfTarget = (name, chapter) => {
  const actor = currentPerson();
  return !!actor && !!memberNameKey(name) && memberNameKey(actor.name) === memberNameKey(name)
    && (!chapterKey(chapter) || chapterKey(actor.chapter) === chapterKey(chapter));
};
const recipientCrossChapter = chapter => {
  const actor = currentPerson();
  return !actor || !chapterKey(chapter) || chapterKey(actor.chapter) !== chapterKey(chapter);
};
readExternalMembers();

// ── 流程：每一段是「有參加嗎？ → 有的話勾選互動夥伴」 ─────────
// 名單和活動由華都更官網同步，不把管理者瀏覽器的手動編輯當作共用資料來源。
let EVENTS = [];

// 後台存的設定：{ members: [{ no, name, job }], events: [{ id, name, date: "2026-07-04", members: ["008"], outside: [{ name, chapter }] }] }
function applyConfig(cfg) {
  if (!cfg || !Array.isArray(cfg.members) || !cfg.members.length) return false;
  ROSTER.clear();
  for (const m of cfg.members) if (m && m.no != null && m.name) {
    const no = String(m.no).padStart(3, "0");
    ROSTER.set(no, { no, name: String(m.name).trim(), job: String(m.job || "").trim() });
  }
  const today = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  EVENTS = (Array.isArray(cfg.events) ? cfg.events : []).filter(e => e && e.id && e.name && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && e.date < today).sort((a, b) => b.date.localeCompare(a.date)).map(e => {
    const [y, mo, d] = e.date.split("-").map(Number);
    return {
      id: e.id, title: `${y === new Date().getFullYear() ? "" : y + "/"}${mo}/${d} ${e.name}`, date: [y, mo, d],
      people: [
        ...(e.members || []).map(no => String(no).padStart(3, "0")).filter(no => ROSTER.has(no)).map(no => ({ no, name: ROSTER.get(no).name })),
        // 外分會參加者：沒有編號，用「o:姓名@分會」當勾選的代號
        ...(e.outside || []).filter(o => o && o.name).map(o => ({ no: `o:${o.name}@${o.chapter || ""}`, name: o.name, chapter: o.chapter || "", ext: true })),
      ],
    };
  });
  return true;
}


// ── 我的燈號：讀每週同步到華都更測試目錄的 PALMS 資料，計算「到綠燈的差距」 ──
const HUA_SITE = LIGHT_SITE;
const HUA_DATA = LIGHT_DATA;
const usesMonthlyChapterLight = person => !!person?.ext && chapterKey(person.chapter).startsWith("華");
async function loadChapterLight(person) {
  const query = new URLSearchParams({ name: person.name, chapter: person.chapter });
  const response = await fetch(`/api/chapter-light?${query}`, { cache: "no-store" });
  if (!response.ok) throw new Error("無法取得外分會燈號資料");
  return response.json();
}
let huaData = null;
const loadHua = () => huaData ||= fetch(HUA_DATA + (HUA_DATA.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .catch(e => { huaData = null; throw e; });

// 以下計分規則照 BNI 會員紅綠燈的六項計分（出席、引薦、來賓、一對一、教育單位、交易價值）
const TIER = {
  absent: [[0, 20], [1, 15], [2, 10]],
  ref:    [[0.75, 5], [1, 10], [1.2, 15], [1.5, 20]],
  vis:    [[1, 10], [2, 15]],
  o2o:    [[0.5, 5], [1, 10], [2, 15]],
  ceu:    [[2, 5], [4, 10], [6, 15]],
  tyfcb:  [[400000, 5], [800000, 10], [2000000, 15]],
};
const GREEN = 70, AMBER = 50, RED = 30;
const LIGHTS = { green: "綠燈", amber: "黃燈", red: "紅燈", grey: "黑燈" };
const lightOf = t => t >= GREEN ? "green" : t >= AMBER ? "amber" : t >= RED ? "red" : "grey";
const scoreAbsent = a => a === 0 ? 20 : a === 1 ? 15 : a === 2 ? 10 : 0;
const byRate = (val, tiers) => tiers.reduce((s, [t, p]) => val >= t - 1e-9 ? p : s, 0);
function scoreOf(m) {
  const W = m.weeks || 1;
  return {
    absent: scoreAbsent(m.A),
    ref: byRate(m.RG / W, TIER.ref),
    vis: byRate(m.V / W * 4, TIER.vis),
    o2o: byRate(m.O2O / W, TIER.o2o),
    ceu: byRate(m.CEU, TIER.ceu),
    tyfcb: byRate(m.TYFCB, TIER.tyfcb),
  };
}
// 貼上名單時用：一行一個名字或編號 → 本分會夥伴；只看前三個中文字（複姓四個），英文名、小名都不管
const COMPOUND = ["張簡", "歐陽", "司馬", "諸葛", "上官", "東方", "皇甫", "范姜", "司徒", "夏侯"];
const zh3 = s => {
  const m = String(s || "").replace(/\s+/g, "").match(/^[\u4e00-\u9fa5]+/);
  return m ? m[0].slice(0, COMPOUND.some(c => m[0].startsWith(c)) ? 4 : 3) : "";
};
function findRoster(line) {
  const s = String(line).trim();
  if (/^\d{1,3}$/.test(s)) return ROSTER.get(s.padStart(3, "0")) || null;
  const k = zh3(s);
  const words = x => String(x).toLowerCase().split(/\s+/).filter(Boolean).sort().join(" ");
  const hits = [...ROSTER.values()].filter(p => k ? zh3(p.name) === k : words(p.name) === words(s));
  return hits.length === 1 ? hits[0] : null;
}
const bulkLeft = {};   // 貼上名單後對不到的名字，重畫畫面時放回框裡

// 兩邊的會員編號不一樣，用中文姓名對
const nameKey = n => {
  const s = String(n || "").trim();
  return zh3(s) || s.replace(/\s+/g, "").toLowerCase();
};
function findMember(d, rosterName, memberNo) {
  // 外籍會員在資料裡可能姓在前（Josh Hung → HungJosh），前後顛倒也算
  const keys = [nameKey(rosterName), rosterName.trim().split(/\s+/).reverse().join("").toLowerCase()];
  const hits = (d.members || []).filter(r => Array.isArray(r) && keys.includes(nameKey(r[1])));
  if (hits.length !== 1) return null;
  const r = hits[0];
  // PALMS 的第 0 欄是排行榜序號，會員編號須取自核對過的分會名單。
  const m = { no: memberNo, name: r[1], weeks: +r[2], P: +r[3], A: +r[4], S: +r[7], RG: +r[8], V: +r[10], O2O: +r[11], CEU: +r[12], TYFCB: +r[13] };
  if (![m.weeks, m.P, m.A, m.S, m.RG, m.V, m.O2O, m.CEU, m.TYFCB].every(Number.isFinite) || m.weeks <= 0) return null;
  m.sc = scoreOf(m);
  m.total = Object.values(m.sc).reduce((a, b) => a + b, 0);
  m.light = lightOf(m.total);
  m.attend = Math.round((m.P + m.S) / (m.weeks || 1) * 100);
  return m;
}

// 外分會月報使用來源已計算的分數；沒有計入週數時不推算 121／引薦件數目標。
function updateMonthlyPortalCounts(member) {
  document.querySelectorAll("[data-gap-flow]").forEach(el => {
    if (!member) { el.textContent = "目前無法取得成績"; return; }
    const is121 = el.dataset.gapFlow === "121";
    const count = member.counts[is121 ? "oneToOne" : "referralsGiven"];
    el.textContent = count == null ? "月報未提供完成件數" : `本期已完成 ${Number(count).toLocaleString("zh-TW")} ${is121 ? "次" : "件"}`;
  });
}
function monthlyScoreCard(member, data) {
  const score = member.reportedScore;
  const light = Object.hasOwn(LIGHTS, member.reportedLight) ? member.reportedLight : lightOf(score);
  const items = [
    ["出席", "absence", member.counts.absence, "次缺席"],
    ["引薦", "referral", member.counts.referralsGiven, "件"],
    ["來賓", "visitor", member.counts.visitors, "位"],
    ["一對一", "oneToOne", member.counts.oneToOne, "次"],
    ["教育培訓", "education", member.counts.ceu, "單位"],
    ["交易價值", "tyfcb", member.counts.tyfcb, "元"],
  ];
  const fmt = value => value == null ? "未提供" : Number(value).toLocaleString("zh-TW");
  return `<div class="score-head t-${light}">
    <div><h2>${esc(member.name)}</h2><p>${esc(data.chapter.name)} · ${esc(data.month.slice(0,4))}/${esc(data.month.slice(4))} 月報</p></div>
    <div class="score-num">${fmt(score)}<small>${LIGHTS[light]}</small></div>
    </div>
    <p class="sec">到綠燈還需 ${fmt(Math.max(0, GREEN - score))} 分（70 分門檻）</p>
    <p class="sec">本期六項紀錄與月報得分</p>
    ${items.map(([label,key,count,unit]) => `<div class="metric"><strong>${label}</strong> <span class="points">${fmt(member.points[key])} 分</span> · ${fmt(count)} ${unit}</div>`).join("")}
    <p class="note">以上分數直接採用來源月報。月報未提供計入週數，121 與引薦顯示已完成件數；教育單位採月報已入帳紀錄。</p>
    <p class="src">資料：<a href="${esc(data.source)}" target="_blank" rel="noopener">${esc(data.chapter.name)}個人燈號月報</a> · ${esc(data.chapter.period || "")}${data.chapter.range ? `（${esc(data.chapter.range)}）` : ""}</p>`;
}

// 用 PALMS 實際計入週數計算目標；不可把固定 26 週套到不同期間。
const GOALS = [
  { key: "O2O", name: "一對一", unit: "次", goal: m => Math.ceil(2 * m.weeks) },
  { key: "RG",  name: "引薦",   unit: "件", goal: m => Math.ceil(1.5 * m.weeks) },
];
const METRICS = [
  { key: "absent", name: "出席", raw: "A", unit: "次缺席", levels: [[2, 10], [1, 15], [0, 20]], need: (m, t) => Math.max(0, m.A - t), action: "少缺席" },
  { key: "ref", name: "引薦", raw: "RG", unit: "件", levels: TIER.ref, need: (m, t) => Math.max(0, Math.ceil(t * m.weeks - 1e-9) - m.RG), action: "再增加" },
  { key: "vis", name: "來賓", raw: "V", unit: "位", levels: TIER.vis, need: (m, t) => Math.max(0, Math.ceil(t * m.weeks / 4 - 1e-9) - m.V), action: "再增加" },
  { key: "o2o", name: "一對一", raw: "O2O", unit: "次", levels: TIER.o2o, need: (m, t) => Math.max(0, Math.ceil(t * m.weeks - 1e-9) - m.O2O), action: "再增加" },
  { key: "ceu", name: "教育培訓", raw: "CEU", unit: "單位", levels: TIER.ceu, need: (m, t) => Math.max(0, t - m.CEU), action: "再增加" },
  { key: "tyfcb", name: "交易價值", raw: "TYFCB", unit: "元", levels: TIER.tyfcb, need: (m, t) => Math.max(0, t - m.TYFCB), action: "再增加" },
];
function metricGaps(m) {
  const deficit = Math.max(0, GREEN - m.total);
  return METRICS.map(v => {
    const current = m.sc[v.key];
    const next = v.levels.find(([, points]) => points > current);
    const enough = v.levels.find(([, points]) => points - current >= deficit);
    const fmt = n => Number(n).toLocaleString("zh-TW");
    const nextText = next ? `下一級 ${next[1]} 分：${v.action} ${fmt(v.need(m, next[0]))} ${v.unit}` : "本項已達最高級";
    const greenText = !deficit ? "已達綠燈" : enough
      ? `單靠此項補足綠燈差距：${v.action} ${fmt(v.need(m, enough[0]))} ${v.unit}`
      : "需要搭配其他項目補足綠燈差距";
    return `<div class="metric"><strong>${v.name}</strong> <span class="points">${current} 分</span> · 目前 ${fmt(m[v.raw])} ${v.unit}
      <small>${nextText}；${greenText}</small></div>`;
  }).join("");
}

function wireRefs(box, list, onDelete) {
  const find = el => list().find(r => r.id === el.closest(".ref").dataset.id);
  box.addEventListener("input", e => {

    save();

  box.addEventListener("change", e => {

    if (del) { onDelete(del.dataset.del); return; }
    const b = e.target.closest("[data-type], [data-contact]");
    if (!b) return;
    const r = find(b);
    if (b.dataset.type) {
      r.type = b.dataset.type;
      b.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b));
    } else {

  });

function readStored(raw = undefined) {
  let s = null;
  if (raw !== undefined) s = raw;
  else try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch {}
  s = { attended: {}, picked: {}, meets: {}, outside: [], gatherings: [], sec: null, refs: {}, lastPhone: "", ...(s || {}) };

      && !EXTERNAL_MEMBERS.has(s.me)) rememberExternalMember(s.actor.name, s.actor.chapter);
  for (const k in s.picked) s.picked[k] = new Set(s.picked[k]);
  // 引薦原本本分會夥伴的四題（r1～r4）合併成一題
  if (s.refs.r2 || s.refs.r3 || s.refs.r4) {

    delete s.refs.r2; delete s.refs.r3; delete s.refs.r4;

  // 名單拿掉的人（例：074）和自己，從舊答案裡清掉，否則完成頁會找不到人
  if (s.me && !personFor(s.me, s.actor)) s.me = null;
  s.actor = s.me ? personFor(s.me, s.actor) : null;
  const gone = no => !ROSTER.has(no) || no === s.me
    || (s.actor && samePerson(s.actor.name, s.actor.chapter, ROSTER.get(no)?.name, CHAPTER));
  for (const k in s.picked) for (const no of s.picked[k]) if (!no.startsWith("o:") && gone(no)) s.picked[k].delete(no);
  for (const no in s.meets) if (gone(no)) delete s.meets[no];
  for (const g of s.gatherings) g.members = (g.members || []).filter(no => !gone(no));
  for (const k in s.refs) s.refs[k] = s.refs[k].filter(r => !r.no || !gone(r.no));
  return s;
}

// 選名字 → 看紅綠燈差多少 → 選「補 key 121」或「補 key 引薦」
const ASK_WHO = false;

function buildSteps() {
  if (!FLOW) { steps = [{ kind: "intro" }, { kind: "who" }, { kind: "light" }]; return; }
  steps = ASK_WHO ? [{ kind: "who" }] : [];
  if (FLOW === "121") {
    const sec = state.sec || "";
    const ev = sec.startsWith("ev:") ? EVENTS.find(e => e.id === sec.slice(3)) : null;
    if (ev) {
      steps.push({ kind: "attend", ev });
      if (state.attended[ev.id]) steps.push({ kind: "pick", ev });
    } else if (sec === "gather") steps.push({ kind: "gather" });
    else if (sec === "indiv") steps.push({ kind: "one21" });      // 本分會會員：勾選
    else if (sec === "ext") steps.push({ kind: "outside" });       // 外分會會員：自己輸入
    else steps.push({ kind: "hub121" }, { kind: "done" });
    return;
  } else {
    steps.push({ kind: "refCombined" });
  }
  steps.push({ kind: "done" });
}

function go(i) {
  buildSteps();
  // 在某個區塊裡往前超過第一題、往後超過最後一題，就回到補 key 121 的選單
  if (FLOW === "121" && state.sec && (i < 0 || i >= steps.length)) { state.sec = null; buildSteps(); i = 0; }
  at = Math.max(0, Math.min(i, steps.length - 1));

const meTag = () => {

  return me ? `<span class="me-tag">${me.ext ? "" : `${esc(me.no)} `}${esc(me.name)} · ${esc(me.chapter)}</span>` : "";
};

function validDate(m, d) {
  m = +m; d = +d;
  if (!m || !d) return false;
  const t = new Date(YEAR, m - 1, d);
  return t.getMonth() === m - 1 && t.getDate() === d;
}
function datePickerValue(m, d) {
  return validDate(m, d) ? `${YEAR}-${String(+m).padStart(2, "0")}-${String(+d).padStart(2, "0")}` : "";
}
function syncDatePicker(container, m, d) {
  const picker = container.querySelector("[data-datepick]");
  if (picker) picker.value = datePickerValue(m, d);
}
function datePartsFromPicker(value) {
  if (!value) return { m: "", d: "" };
  const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return match && +match[1] === YEAR && validDate(match[2], match[3])
    ? { m: match[2], d: match[3] } : null;
}

function filterBox(listSel) {
  $("#filter").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll(listSel + " [data-k]").forEach(l =>
      l.style.display = !q || l.dataset.k.includes(q) ? "" : "none");
  });
}
const key = p => esc(`${p.no} ${p.name} ${p.job || ""}`.toLowerCase());

function render() {
  if (!currentMemberMatchesStored()) { returnToMemberPicker(); return; }
  const s = steps[at];
  const pct = s.kind === "done" ? 100 : Math.round(at / (steps.length - 1) * 100);
  $("#bar").style.width = pct + "%";
  $("#light").className = "light " + (s.kind === "done" || s.kind === "intro" ? "green" : FLOW ? "amber" : "red");
  const app = $("#app");

  if (s.kind === "intro") {
    app.innerHTML = `
      <section class="card">
        <p class="step">開始</p>
        <p class="q">一起把燈號變綠！</p>
        <p class="hint">跟著幾個簡單步驟，一起看看你的教育培訓紀錄，把還沒 key 的 121 和引薦單補起來！</p>
        ${videoBlock()}
        <p class="hint"><a href="./training.html" target="_blank" rel="noopener">查看華都更實際培訓紀錄</a></p>
        <div class="actions"><button class="primary" id="next">出發 →</button></div>
      </section>`;
    $("#next").onclick = () => go(1);
  }

  if (s.kind === "who") {
    const all = [...ROSTER.values()].sort((a, b) => a.no.localeCompare(b.no));
    const external = [...EXTERNAL_MEMBERS.values()].sort((a, b) => a.chapter.localeCompare(b.chapter) || a.name.localeCompare(b.name));
    app.innerHTML = `

        <p class="step">首先</p>
        <p class="q">請問你是哪一位夥伴？</p>
        <p class="hint">選好之後，後面的名單就不會出現你自己。其他分會夥伴請在下方填寫姓名與分會。</p>
        <div class="tools"><input id="filter" type="search" placeholder="搜尋編號或名字" aria-label="搜尋會員編號或名字"></div>
        <div class="who-roster-head">
          <h2 class="who-group"><button type="button" class="who-roster-toggle" id="toggleRoster" aria-expanded="true" aria-controls="whoRoster">${CHAPTER}分會名單</button></h2>
          <label class="who-external-switch"><input type="checkbox" id="chooseExternal" aria-controls="externalMemberForm">外分會</label>
        </div>
        <div id="whoRoster">
        <div class="list one" id="list">
          ${all.map(p => `
            <label data-k="${key(p)}" class="${p.no === state.me ? "on" : ""}">
              <input type="radio" name="me" value="${p.no}" ${p.no === state.me ? "checked" : ""}>

            </label>`).join("")}
        </div>
        </div>
        <div class="who-other" id="otherChapterEntry">
          <h2 class="who-group">其他分會／手動輸入</h2>
          <p class="hint">請填寫 BNI Connect 上的完整會員姓名與正式分會名稱；已填過的夥伴可直接選回原草稿。</p>
          ${external.length ? `<details class="who-saved-members"><summary>已填過的外分會會員</summary><div class="list one" id="externalList">${external.map(p => `
            <label class="${p.no === state.me ? "on" : ""}">
              <input type="radio" name="me" value="${esc(p.no)}" ${p.no === state.me ? "checked" : ""}>
              <span class="nm">${esc(p.name)} <span class="en">${esc(p.chapter)}</span></span>
            </label>`).join("")}</div></details>` : ""}
          <form id="externalMemberForm">
            <label class="field"><span>姓名</span><input name="name" autocomplete="name" maxlength="200" required placeholder="例：王小明"></label>
            <label class="field"><span>分會</span><input name="chapter" maxlength="200" required placeholder="請填正式分會名稱"></label>
            <p class="who-error" id="externalMemberError" role="alert" hidden></p>
            <button class="add" type="submit">使用這位其他分會夥伴</button>
          </form>
        </div>
        <div class="actions sticky">
          <button class="ghost" id="back">←</button>
          <button class="primary" id="next" ${state.me ? "" : "disabled"}>下一步 →</button>
        </div>
      </section>`;
    $("#toggleRoster").onclick = () => {
      const expanded = $("#toggleRoster").getAttribute("aria-expanded") !== "true";
      $("#toggleRoster").setAttribute("aria-expanded", String(expanded));
      $("#whoRoster").hidden = !expanded;
      if (expanded) $("#chooseExternal").checked = false;
    };
    $("#chooseExternal").onchange = e => {
      if (!e.target.checked) {
        $("#whoRoster").hidden = false;
        $("#toggleRoster").setAttribute("aria-expanded", "true");
        return;
      }
      $("#whoRoster").hidden = true;
      $("#toggleRoster").setAttribute("aria-expanded", "false");
      $("#otherChapterEntry").scrollIntoView({ behavior: "smooth", block: "start" });
      $("#externalMemberForm input[name=name]").focus({ preventScroll: true });
    };
    const choose = memberNo => {
      if (memberNo !== state.me) {
        archiveCurrentMemberDraft();
        restoreMemberDraft(memberNo);
      }
      document.querySelectorAll('#list label, #externalList label').forEach(l => l.classList.toggle("on", l.querySelector("input").checked));
      $("#next").disabled = false;
      save();
    };
    app.querySelectorAll('#list, #externalList').forEach(list => list.addEventListener("change", e => choose(e.target.value)));
    $("#externalMemberForm").addEventListener("submit", e => {
      e.preventDefault();
      const form = e.currentTarget, name = identityText(form.elements.name.value), chapter = identityText(form.elements.chapter.value);
      const error = $("#externalMemberError");
      if (!memberNameKey(name) || !chapterKey(chapter)) { error.textContent = "請填寫完整姓名與分會名稱。"; error.hidden = false; return; }
      if (chapterKey(chapter) === chapterKey(CHAPTER)) {
        error.textContent = `如果你是${CHAPTER}夥伴，請從上方名單選擇；其他分會請填正式分會名稱。`;
        error.hidden = false; return;
      }
      const member = rememberExternalMember(name, chapter);
      archiveCurrentMemberDraft();
      restoreMemberDraft(member.no);
      go(at + 1);
    });
    filterBox("#list");
    $("#back").onclick = () => go(at - 1);
    $("#next").onclick = () => go(at + 1);
  }

  if (s.kind === "light") {
    const me = currentPerson();
    app.innerHTML = `
      <p class="portal-h first">${esc(me?.name || "")}，要先補哪一個？</p>
      ${VIDEO_URL ? `<p class="vlink"><a href="${VIDEO_URL}" target="_blank" rel="noopener">▶ 第一次用？看 10 分鐘影片教學</a></p>` : ""}

        <div id="memberTraining" aria-live="polite"><p class="hint">正在查詢實際培訓報名紀錄…</p></div>

      if (steps[at] === s && $("#memberTraining")) $("#memberTraining").innerHTML = HuaTraining.renderFor(me.name, me.chapter);
    }).catch(() => {
      if (steps[at] === s && $("#memberTraining")) $("#memberTraining").innerHTML = `<p class="hint">培訓紀錄暫時讀不到。<a href="https://bni-train.autolab.cloud/explorer/" target="_blank" rel="noopener">查看原始查詢</a></p>`;
    });
    if (usesMonthlyChapterLight(me)) loadChapterLight(me).then(d => {
      if (steps[at] !== s) return;
      const m = d.status === "found" ? d.member : null;
      updateMonthlyPortalCounts(m);
      $("#lightCard").innerHTML = m ? monthlyScoreCard(m, d) : `<p class="step">尚無相符資料</p>
        <p class="hint">${d.month ? `${esc(d.month.slice(0,4) + "/" + d.month.slice(4))} 月報中找不到「${esc(me.chapter)}／${esc(me.name)}」的唯一個人紀錄，暫不計算燈號與差距。` : "當月與前一個月尚無可讀取的月報，暫不計算燈號與差距。"}</p>
        ${d.source ? `<p class="hint"><a href="${esc(d.source)}" target="_blank" rel="noopener">查看來源月報</a></p>` : ""}`;
    }).catch(() => {
      if (steps[at] !== s) return;
      updatePortalGaps(null);
      $("#lightCard").innerHTML = `<p class="step">月報暫時無法取得</p><p class="hint">當月與前一個月的華字輩月報目前無法讀取，請稍後再試；121 與引薦仍可繼續填寫。</p>`;
    });
    if (HUA_DATA && !me.ext) loadHua().then(d => {
      if (steps[at] !== s) return;
      const m = findMember(d, me.name, me.no);
      updatePortalGaps(m);
      $("#lightCard").innerHTML = m ? scoreCard(m, d) : `
        <p class="step">查不到</p>
        <p class="q">紅綠燈資料裡找不到「${esc(nameKey(me.name))}」</p>
        <p class="hint">可能是新入會、資料還沒更新。可以到 <a href="${HUA_SITE}" target="_blank" rel="noopener">${CHAPTER}紅綠燈</a> 自己查。</p>`;
    }).catch(() => {
      if (steps[at] !== s) return;
      updatePortalGaps(null);
      $("#lightCard").innerHTML = `
        <p class="step">暫時讀不到</p>
        <p class="hint">紅綠燈資料暫時讀不到，可以到 <a href="${HUA_SITE}" target="_blank" rel="noopener">${CHAPTER}紅綠燈</a> 查會員，或直接從下面開始補 key。</p>`;
    });
  }

  if (s.kind === "attend") {
    app.innerHTML = `
      <section class="card">
        ${meTag()}
        <p class="step">補 key 121</p>
        <p class="q">請問你有參加 ${s.ev.title} 嗎？</p>
        <p class="hint">&nbsp;</p>
        <div class="yn">
          <button class="yes" id="y">有</button>
          <button id="n">沒有</button>
        </div>
        <div class="actions"><button class="ghost" id="back">← 上一步</button></div>
      </section>`;
    $("#y").onclick = () => { state.attended[s.ev.id] = true; go(at + 1); };
    $("#n").onclick = () => { state.attended[s.ev.id] = false; state.picked[s.ev.id] = new Set(); go(at + 1); };
    $("#back").onclick = () => go(at - 1);
  }

  if (s.kind === "pick") {
    const set = state.picked[s.ev.id] ||= new Set();
    app.innerHTML = `
      <section class="card">
        ${meTag()}
        <p class="step">${s.ev.title}</p>
        <p class="q">以下這些夥伴，哪些在當天你有互動交流？</p>
        <p class="hint">請打勾（可複選）</p>
        <div class="tools">
          <input id="filter" type="search" placeholder="搜尋編號或名字">
          <span class="count" id="count"></span>
        </div>
        <div class="list" id="list">
          ${others(s.ev.people).map(p => `
            <label data-k="${key(p)}">
              <input type="checkbox" value="${p.no}" ${set.has(p.no) ? "checked" : ""}>
              <span class="nm"><span class="no">${p.ext ? "外" : p.no}</span> ${esc(p.name)}${p.ext ? ` <span class="en">${esc(p.chapter)}</span>` : ""}</span>
            </label>`).join("")}
        </div>
        <div class="actions sticky">
          <button class="ghost" id="back">←</button>
          <button class="primary" id="next">下一題 →</button>
        </div>
      </section>`;
    const sync = () => {
      document.querySelectorAll("#list label").forEach(l =>
        l.classList.toggle("on", l.querySelector("input").checked));
      $("#count").textContent = `已勾 ${set.size} 位`;
    };
    $("#list").addEventListener("change", e => {
      e.target.checked ? set.add(e.target.value) : set.delete(e.target.value);
      sync(); save();
    });
    filterBox("#list");
    sync();
    $("#back").onclick = () => go(at - 1);
    $("#next").onclick = () => go(at + 1);
  }

  if (s.kind === "one21") {
    const people = members();
    app.innerHTML = `
      <section class="card">
        ${meTag()}
        <p class="step">${CHAPTER}會員 121</p>
        <p class="q">你過去半年，曾參加組聚、或有跟哪些${CHAPTER}夥伴 121？</p>
        <p class="hint">請打勾，再填日期、選交流方式</p>
        <div class="tools">
          <input id="filter" type="search" placeholder="搜尋編號、名字或專業">
          <span class="count" id="count"></span>
        </div>
        <div class="list one" id="list">
          ${people.map(p => {
            const v = state.meets[p.no];
            return `
            <div class="row ${v ? "on" : ""}" data-k="${key(p)}" data-no="${p.no}">
              <label>
                <input type="checkbox" ${v ? "checked" : ""}>
                <span class="who"><span class="no">${p.no}</span> ${esc(p.name)}<span class="job">${esc(p.job)}</span></span>
              </label>
              <div class="detail">
                <div class="date">
                  <label class="date-manual"><span>手動輸入 ${YEAR} 年</span>
                    <input inputmode="numeric" maxlength="2" data-f="m" value="${v?.m ?? ""}" aria-label="月份"> 月
                    <input inputmode="numeric" maxlength="2" data-f="d" value="${v?.d ?? ""}" aria-label="日期"> 日
                  </label>
                  <label class="date-calendar"><span>選日期</span>
                    <input type="date" data-datepick min="${YEAR}-01-01" max="${YEAR}-12-31" value="${datePickerValue(v?.m, v?.d)}" aria-label="使用日曆選擇日期">
                  </label>
                </div>
                <label class="field"><span>地點</span><input data-f="place" list="meeting-locations" value="${esc(v?.place || "")}" placeholder="輸入或選擇地點"></label>
                <div class="kinds"><span class="kinds-label">主題</span>
                  ${KINDS.map(k => `<button type="button" data-kind="${k}" class="${v?.kind === k ? "sel" : ""}">${k}</button>`).join("")}
                </div>
              </div>
            </div>`;
          }).join("")}
        </div>
        <div class="actions sticky">
          <button class="ghost" id="back">←</button>
          <button class="primary" id="next">這一項填好了 →</button>
        </div>
      </section>`;
    const list = $("#list");
    const sync = () => { $("#count").textContent = `已勾 ${Object.keys(state.meets).length} 位`; };
    const rowOf = el => el.closest(".row");
    list.addEventListener("change", e => {
      if (e.target.matches("[data-datepick]")) {
        const parts = datePartsFromPicker(e.target.value);
        if (!parts) return;
        const row = rowOf(e.target), no = row.dataset.no;
        Object.assign(state.meets[no], parts);
        row.querySelector('[data-f="m"]').value = parts.m;
        row.querySelector('[data-f="d"]').value = parts.d;
        row.classList.remove("bad");
        save();
        return;
      }
      if (e.target.type !== "checkbox") return;
      const row = rowOf(e.target), no = row.dataset.no;
      if (e.target.checked) state.meets[no] = { m: "", d: "", place: "", kind: "" };
      else delete state.meets[no];
      row.classList.toggle("on", e.target.checked);
      row.classList.remove("bad");
      if (e.target.checked) row.querySelector("[data-f=m]").focus();
      sync(); save();
    });
    list.addEventListener("input", e => {
      const f = e.target.dataset.f;
      if (!f) return;
      if (f === "m" || f === "d") e.target.value = e.target.value.replace(/\D/g, "");
      const row = rowOf(e.target), value = state.meets[row.dataset.no];
      value[f] = e.target.value;
      syncDatePicker(row, value.m, value.d);
      if (f === "m" && e.target.value.length === 2) rowOf(e.target).querySelector("[data-f=d]").focus();
      save();
    });
    list.addEventListener("click", e => {
      const b = e.target.closest("[data-kind]");
      if (!b) return;
      const row = rowOf(b), f = "kind";
      state.meets[row.dataset.no][f] = b.dataset[f];
      b.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b));
      save();
    });
    filterBox("#list");
    sync();
    $("#back").onclick = () => go(at - 1);
    $("#next").onclick = () => {
      let first = null, n = 0;
      list.querySelectorAll(".row").forEach(row => {
        const v = state.meets[row.dataset.no];
        const bad = v && (!validDate(v.m, v.d) || !v.place || !v.kind);
        row.classList.toggle("bad", !!bad);
        if (bad) { n++; first ||= row; }
      });
      if (first) {
        $("#filter").value = ""; $("#filter").dispatchEvent(new Event("input"));
        first.scrollIntoView({ behavior: "smooth", block: "center" });
        toast(`還有 ${n} 位的日期、地點或主題沒填好`);
        return;
      }
      go(at + 1);
    };
  }

  if (s.kind === "outside") {
    if (!state.outside.length) state.outside.push(blankOut());
    app.innerHTML = `
      <section class="card">
        ${meTag()}
        <p class="step">其他／手動輸入會員 121</p>
        <p class="q">你過去半年，曾跟哪些其他夥伴 121？</p>
        <p class="hint">一筆填完，按「＋ 再加一筆」可以繼續填；沒有的話按「跳過」</p>
        <div id="outs"></div>
        <button class="add" id="add">＋ 再加一筆</button>
        <div class="actions">
          <button class="ghost" id="back">←</button>
          <button class="ghost" id="skip">跳過</button>
          <button class="primary" id="next">這一項填好了 →</button>
        </div>
      </section>`;
    const box = $("#outs");
    const draw = () => {
      box.innerHTML = state.outside.map((v, i) => `
        <div class="entry" data-i="${i}">
          <div class="entry-top">
            <span class="entry-n">第 ${i + 1} 筆</span>
            ${state.outside.length > 1 ? `<button type="button" class="del" data-del="${i}" aria-label="刪除第 ${i + 1} 筆">×</button>` : ""}
          </div>
          <label class="field"><span>名字</span><input data-f="name" value="${esc(v.name)}" placeholder="請輸入會員姓名"></label>
          <label class="field"><span>分會名</span><input data-f="chapter" value="${esc(v.chapter)}" placeholder="可填自己或其他分會"></label>
          <div class="date">
            <label class="date-manual"><span>手動輸入 ${YEAR} 年</span>
              <input inputmode="numeric" maxlength="2" data-f="m" value="${esc(v.m)}" aria-label="月份"> 月
              <input inputmode="numeric" maxlength="2" data-f="d" value="${esc(v.d)}" aria-label="日期"> 日
            </label>
            <label class="date-calendar"><span>選日期</span>
              <input type="date" data-datepick min="${YEAR}-01-01" max="${YEAR}-12-31" value="${datePickerValue(v.m, v.d)}" aria-label="使用日曆選擇日期">
            </label>
          </div>
          <label class="field"><span>地點</span><input data-f="place" list="meeting-locations" value="${esc(v.place)}" placeholder="輸入或選擇地點"></label>
          <div class="kinds"><span class="kinds-label">主題</span>
            ${OUT_KINDS.map(k => `<button type="button" data-kind="${k}" class="${v.kind === k ? "sel" : ""}">${k}</button>`).join("")}
          </div>
        </div>`).join("");
    };
    draw();
    const idx = el => +el.closest(".entry").dataset.i;
    box.addEventListener("input", e => {
      const f = e.target.dataset.f;
      if (!f) return;
      if (f === "m" || f === "d") e.target.value = e.target.value.replace(/\D/g, "");
      const entry = e.target.closest(".entry"), value = state.outside[idx(e.target)];
      value[f] = e.target.value;
      syncDatePicker(entry, value.m, value.d);
      if (f === "m" && e.target.value.length === 2) e.target.closest(".entry").querySelector("[data-f=d]").focus();
      save();
    });
    box.addEventListener("change", e => {
      if (!e.target.matches("[data-datepick]")) return;
      const parts = datePartsFromPicker(e.target.value);
      if (!parts) return;
      const entry = e.target.closest(".entry"), value = state.outside[idx(e.target)];
      Object.assign(value, parts);
      entry.querySelector('[data-f="m"]').value = parts.m;
      entry.querySelector('[data-f="d"]').value = parts.d;
      entry.classList.remove("bad");
      save();

        ${[...EVENTS.map(ev => ev.title), "gather", "121", "outside"].filter(src => rows.some(r => r.src === src)).map(src => {
          const rs = rows.map((r, index) => ({ r, index })).filter(({ r }) => r.src === src);
          const title = src === "121" ? `${CHAPTER}夥伴 121` : src === "outside" ? "其他／手動輸入夥伴 121" : src === "gather" ? "其他活動／組聚" : src;
          const chip = r => src === "outside"
            ? `${esc(r.name)}<small>${esc(r.chapter)} · ${r.m}/${r.d}</small>`
            : `${r.ext ? "" : r.no + " "}${esc(r.name)}${r.ext ? `<small>${esc(r.chapter)}</small>` : ""}${src === "121" ? `<small>${r.m}/${r.d}</small>` : ""}${src === "gather" ? `<small>${esc(r.kind)} ${r.m}/${r.d}</small>` : ""}`;
          return `<section data-draft-group><h3>${esc(title)}</h3>
            ${rs.length ? `<div class="chips">${rs.map(({ r, index }) => `<span class="chip" data-draft-kind="121" data-draft-index="${index}">${chip(r)}<button type="button" class="chip-clear" data-clear-draft="121:${index}" aria-label="清除 ${esc(r.name)} 的 121 Key 單">清除Key單</button></span>`).join("")}</div>`
                        : ""}</section>`;
        }).join("")}
        </section>
        <section id="draft-details-ref" aria-label="引薦待辦明細" hidden>
        <h2 class="part">引薦待辦明細</h2>
        ${REF_QS.filter(q => refRows.some(r => r.qid === q.id)).map(q => {
          const refs = refRows.map((r, index) => ({ r, index })).filter(({ r }) => r.qid === q.id);
          return `<section data-draft-group><h3>${esc(q.short)}</h3>
            ${refs.length ? `<div class="chips">${refs.map(({ r, index }) => `<span class="chip" data-draft-kind="ref" data-draft-index="${index}">${esc(r.no ? `${r.no} ${r.name}` : `${r.name}（${r.chapter}）`)}<button type="button" class="chip-clear" data-clear-draft="ref:${index}" aria-label="清除 ${esc(r.name)} 的引薦 Key 單">清除Key單</button></span>`).join("")}</div>`
                      : ""}</section>`;
        }).join("")}
        </section>
        <div class="actions">
          <button class="ghost" id="back">←</button>
          <details class="bni-export">
            <summary>其他方式：下載 Excel</summary>
            <p class="hint">你也可以下載資料，再自行到 BNI Connect key in。</p>
            <button class="primary" id="dl" ${rows.length || refRows.length ? "" : "disabled"}>下載 Excel 備份</button>
          </details>
        </div>
      </section>
      <section class="card connect">
        <p class="step">最後一步 💪</p>
        <p class="q">在這一頁登入 BNI Connect 並送出</p>
        <p class="hint">先登入並查詢配對，再核對會員與單據內容。確認後勾選要送出的項目；每筆會依序送出，結果會列在各筆資料旁。</p>
        <div id="bni-connect-widget"></div>
        <details class="bni-help">
          <summary>需要手動操作或教學？</summary>
          <p class="tip"><b>🔑 忘記密碼？</b>在 BNI Connect 登入頁點「忘記使用者名稱／密碼」重新設定。</p>
          <p class="tip"><b>🎬 不知道怎麼 key？</b>看華都更版 Key 單教學影片${GUIDE_PDF ? "，或下載講義一步一步照著做" : ""}。</p>
          <div class="links ${GUIDE_PDF ? "two" : ""}">
            ${CONNECT_LINKS.map(l => `<a class="link" href="${l.href}" target="_blank" rel="noopener">
              <span class="link-t">${l.label}</span><span class="link-s">${l.sub}</span><span class="link-go">↗</span></a>`).join("")}
            <a class="link" href="https://www.youtube.com/watch?v=oXdds_PsTb8&amp;list=PLh29DqPYyf2Jfx_ArCnlU_SDADH_gElKz" target="_blank" rel="noopener">
              <span class="link-t">華都更 Key 單教學</span><span class="link-s">YouTube・華都更版</span><span class="link-go">▶</span></a>
            ${GUIDE_PDF ? `<a class="link" href="${GUIDE_PDF}" download="BNI Connect 系統教學 ${CHAPTER}.pdf">
              <span class="link-t">下載講義</span><span class="link-s">PDF</span><span class="link-go">↓</span></a>` : ""}
          </div>
        </details>
      </section>`;
    const widget = window.BniConnect.mount($("#bni-connect-widget"), keyinData(rows, refRows), {
      onConfirmed: cleanup.confirmed,
      onClearCompleted: cleanup.refresh,
      onClearDrafts: cleanup.clearAll,
      onEditDraft: item => { if (!cleanup.edit(item)) toast("這筆草稿已變更，請重新整理後再編輯。"); },
    });
    app.onclick = e => {
      const toggle = e.target.closest("[data-draft-toggle]");
      if (toggle && !toggle.disabled) {
        const panel = document.getElementById(toggle.getAttribute("aria-controls"));
        const expanded = toggle.getAttribute("aria-expanded") !== "true";
        toggle.setAttribute("aria-expanded", String(expanded));
        panel.hidden = !expanded;
        toggle.querySelector(".draft-toggle-hint").textContent = expanded ? "點擊收起" : "點擊查看";
        return;
      }
      const button = e.target.closest("[data-clear-draft]");
      if (!button) return;
      if (widget?.getStatus().busy) { toast("BNI Connect 處理中，請稍後再清除草稿。"); return; }
      const [kind, sourceIndex] = button.dataset.clearDraft.split(":");
      if (!cleanup.clearOne({ kind, sourceIndex: Number(sourceIndex) })) toast("草稿暫時無法清除，請重新整理後再試。");
    };
    $("#back").onclick = () => go(at - 1);
    $("#dl").onclick = () => download(rows, refRows);
    syncStatus(rows, refRows);
  }
}

// 書籤小工具：在 BNI Connect 頁面上載入 keyin.js（放在本站，更新不必重裝書籤）
// 小工具程式直接打包在書籤網址中，私人測試站也能使用。
const KEYIN_SOURCE = "/* 追綠光 · 一鍵帶入 BNI Connect\n *\n * 由書籤載入，在 BNI Connect 網頁版右側開一個小面板：\n *   1. 打開時自動開一個小視窗到追綠光網站（bridge.html），拿回這個瀏覽器在完成頁存下的最新 key 單資料；\n *      讀不到時才用「複製 key 單資料」貼上\n *   2. 夥伴自己打開「一對一」或「引薦單」表單，按面板上某一筆的「填入」\n *   3. 一筆一筆「填入」時，檢查與按「提交」由夥伴自己來\n *   4. 也可以勾選多筆按「自動 key」：每筆填好後讀回檢查，全部對得上才按「提交」，\n *      對不上、表單沒關、跳出提示都會立刻停下來；外分會夥伴要從搜尋結果點人，一律跳過\n *\n * 不碰帳號密碼。資料只存在這台電腦這個瀏覽器（localStorage）。\n */\n(() => {\n  if (location.protocol !== \"https:\" || ![\"www.bniconnectglobal.com\", \"bniconnectglobal.com\"].includes(location.hostname)) {\n    alert(\"請先登入 BNI Connect 網頁版，再點這個書籤。\");\n    return;\n  }\n  const KEY = \"hua-urban-greenlight-bni-keyin-v1\";\n  const SITE = window.__huaGreenlightSite || new URL(\"./\", document.currentScript.src).href;\n  if (window.__huaGreenlight) { window.__huaGreenlight.toggle(); return; }\n\n  // ── 資料 ───────────────────────────────────────────────\n  let data = null;   // { me, rows121: [...], refs: [...], done: { \"121-0\": true, ... } }\n  try { data = JSON.parse(localStorage.getItem(KEY) || \"null\"); } catch {}\n  if (data) data.pending ||= {};\n  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };\n\n  // 新資料取代舊資料時，已完成（含 BNI 已有紀錄）的勾勾照內容對回去，不會重複 key\n  const sig = (kind, r) => kind + \"|\" + (kind === \"121\"\n    ? [r.name, r.chapter, r.date, r.place, r.topic] : [r.name, r.chapter, r.type, r.referredName, r.content, r.phone]).join(\"|\");\n  function merge(next) {\n    if (!data) return next;\n    const keep = {};\n    for (const kind of [\"121\", \"ref\"]) (kind === \"121\" ? data.rows121 : data.refs).forEach((r, i) => {\n      const k = `${kind}-${i}`;\n      if (data.done[k] || data.pending?.[k]) keep[sig(kind, r)] = { done: !!data.done[k], pending: !!data.pending?.[k], dupe: !!data.dupe?.[k], note: data.note?.[k] };\n    });\n    next.dupe = {}; next.note = {}; next.pending = {};\n    for (const kind of [\"121\", \"ref\"]) (kind === \"121\" ? next.rows121 : next.refs).forEach((r, i) => {\n      const old = keep[sig(kind, r)], k = `${kind}-${i}`;\n      if (!old) return;\n      if (old.done) next.done[k] = true;\n      if (old.pending) next.pending[k] = true;\n      if (old.dupe) next.dupe[k] = true;\n      if (old.note) next.note[k] = old.note;\n    });\n    return next;\n  }\n  const parse = txt => {\n    const d = JSON.parse(txt);\n    if (!d || d.app !== \"hua-urban-greenlight\" || !Array.isArray(d.rows121) || !Array.isArray(d.refs)) throw new Error(\"格式不對\");\n    if (d.refs.some(r => !String(r.referredName || \"\").trim() || !String(r.content || \"\").trim())) throw new Error(\"引薦缺少被引薦人姓名或內容\");\n    return { me: d.me, rows121: d.rows121, refs: d.refs, done: {}, pending: {} };\n  };\n\n  // ── 姓名比對：BNI 選單是「丁 乃玉 Margaret Ding」，我們是「丁乃玉 Margrett」 ──\n  // 只看名字的前三個中文字（複姓四個字），後面的英文名、中文小名都不管：\n  //   「陳力羣 娃娃」「陳 力羣 Lily」→ 陳力羣；「張簡筱凡Sarah」→ 張簡筱凡；「王瑀Eva」→ 王瑀\n  const COMPOUND = [\"張簡\", \"歐陽\", \"司馬\", \"諸葛\", \"上官\", \"東方\", \"皇甫\", \"范姜\", \"司徒\", \"夏侯\"];\n  const zhName = s => {\n    const m = String(s || \"\").replace(/\\s+/g, \"\").match(/^[\\u4e00-\\u9fa5]+/);\n    if (!m) return \"\";\n    return m[0].slice(0, COMPOUND.some(c => m[0].startsWith(c)) ? 4 : 3);\n  };\n  const nameKey = s => zhName(s) || String(s || \"\").replace(/\\s+/g, \"\").toLowerCase();\n  const sameName = (a, b) => {\n    if (nameKey(a) === nameKey(b)) return true;\n    // 外籍會員可能姓名顛倒（Josh Hung ↔ Hung Josh）\n    const w = s => String(s || \"\").toLowerCase().split(/\\s+/).filter(Boolean).sort().join(\" \");\n    return !!w(a) && w(a) === w(b);\n  };\n\n  // ── 操作 React（MUI）表單 ─────────────────────────────────\n  const sleep = ms => new Promise(r => setTimeout(r, ms));\n  const dialog = () => [...document.querySelectorAll(\".MuiDialog-root\")].pop() || null;\n  const dialogKind = d => {\n    const t = d ? d.innerText : \"\";\n    return t.includes(\"一對一\") ? \"121\" : t.includes(\"引薦單\") ? \"ref\" : null;\n  };\n  function setText(el, v) {\n    if (!el) return false;\n    const proto = el.tagName === \"TEXTAREA\" ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;\n    Object.getOwnPropertyDescriptor(proto, \"value\").set.call(el, v);\n    el.dispatchEvent(new Event(\"input\", { bubbles: true }));\n    el.dispatchEvent(new Event(\"change\", { bubbles: true }));\n    el.dispatchEvent(new Event(\"blur\", { bubbles: true }));\n    return true;\n  }\n  async function pickOption(combo, match) {\n    if (!combo) return null;\n    combo.dispatchEvent(new MouseEvent(\"mousedown\", { bubbles: true }));\n    await sleep(400);\n    const opts = [...document.querySelectorAll('[role=\"listbox\"] [role=\"option\"]')];\n    const hits = opts.filter(o => match(o.innerText.trim(), o.getAttribute(\"data-value\")));\n    const hit = hits.length === 1 ? hits[0] : null;\n    if (hit) hit.click();\n    else document.activeElement?.dispatchEvent(new KeyboardEvent(\"keydown\", { key: \"Escape\", bubbles: true }));\n    await sleep(300);\n    return hit ? hit.innerText.trim() : null;\n  }\n  function setCheck(el, want) { if (el && el.checked !== want) el.click(); }\n  // 外分會：打開「搜尋分會／跨分會查找」，姓填進「名字」欄、名填進「姓氏」欄（BNI 這兩欄是反的）\n  function splitName(full) {\n    const zh = zhName(full);\n    if (!zh) return null;\n    const n = COMPOUND.some(c => zh.startsWith(c)) ? 2 : 1;\n    return { family: zh.slice(0, n), given: zh.slice(n) };\n  }\n  // BNI 在勾選搜尋結果、關閉表單時會跳出瀏覽器的「您確定嗎？」；自動流程裡暫時代答「確定」\n  // 「系統中已有另一個一對一會員符合，此一對一會面已被記錄，您想要繼續嗎？」→ 一律回答取消，不重複送\n  const isDup = m => /已被記錄|已有另一個|already/i.test(String(m || \"\"));\n  async function withConfirm(fn, seen) {\n    const orig = window.confirm;\n    window.confirm = m => { if (seen) seen.push(String(m || \"\")); return !isDup(m); };\n    try { fn(); await sleep(1200); } finally { window.confirm = orig; }\n  }\n  // 搜尋視窗：主表單以外、有「查找／搜尋」按鈕的那個\n  //   引薦單 → 標題「跨分會查找」、按鈕「查找」；一對一 → 標題「搜尋分會」、按鈕「搜尋」\n  //   （主表單本身也有一顆「跨分會查找／搜尋分會」按鈕，不能只看文字）\n  const SEARCH_BTN = /^(查找|搜尋)$/;\n  const searchDialog = main => [...document.querySelectorAll(\".MuiDialog-root\")].find(x => x !== main && /跨分會查找|搜尋分會/.test(x.innerText)\n    && [...x.querySelectorAll(\"button\")].some(b => SEARCH_BTN.test(b.innerText.trim()))) || null;\n  const chapterKey = s => String(s || \"\").replace(/\\s+|分會/g, \"\").replace(/[A-Za-z].*$/, \"\");\n\n  // 外分會：跨分會查找 → 只有一位「名字＋分會」都對得上的才自動勾選；回傳 null 代表成功，否則是原因\n  async function selectExt(d, r) {\n    const btn = [...d.querySelectorAll(\"button\")].find(b => /搜尋分會|跨分會查找/.test(b.innerText));\n    const nm = splitName(r.name);\n    if (!r.chapter) return `「${r.name}」缺少分會，請手動確認身分後再填入`;\n    if (!btn || !nm) return `找不到搜尋按鈕，請手動找「${r.name}」${r.chapter ? `（${r.chapter}）` : \"\"}`;\n    btn.click();\n    let s = null;\n    for (let i = 0; i \u003c 15 && !s; i++) { await sleep(200); s = searchDialog(d); }\n    if (!s) return `打不開「${btn.innerText.trim()}」，請手動找「${r.name}」${r.chapter ? `（${r.chapter}）` : \"\"}`;\n    const inputs = s.querySelectorAll('input[type=\"text\"]');\n    setText(inputs[0], nm.family);   // 標示「名字」的欄位其實要填姓\n    setText(inputs[1], nm.given);    // 標示「姓氏」的欄位其實要填名\n    await sleep(200);\n    [...s.querySelectorAll(\"button\")].find(b => SEARCH_BTN.test(b.innerText.trim()))?.click();\n    let rows = [];\n    for (let i = 0; i \u003c 25; i++) {\n      await sleep(250);\n      rows = [...s.querySelectorAll('tr, [role=\"row\"]')].filter(x => x.querySelector('input[type=\"checkbox\"]') && !/名稱/.test(x.innerText));\n      if (rows.length) break;\n    }\n    const ck = chapterKey(r.chapter);\n    const hits = rows.filter(x => sameName(x.innerText.trim().split(/\\t|\\n/)[0], r.name) && (!ck || x.innerText.includes(ck)));\n    if (hits.length !== 1) {\n      return `搜尋「${r.name}」${r.chapter ? `（${r.chapter}）` : \"\"}找到 ${hits.length} 位符合的，請在搜尋結果裡自己點選`;\n    }\n    await withConfirm(() => hits[0].querySelector('input[type=\"checkbox\"]').click());\n    for (let i = 0; i \u003c 15 && searchDialog(d); i++) await sleep(200);\n    return pickedName(d, r.name) ? null : `已勾選「${r.name}」，但表單上看不到，請檢查「至／會面」欄`;\n  }\n  // 選好外分會夥伴後，表單會在下拉選單上方顯示他的名字（「劉 政良Cheng-Liang Liu」）\n  const pickedName = (d, name) => d.innerText.split(\"\\n\").some(l => sameName(l.trim(), name));\n\n  // 關掉表單（BNI 會問「您確定嗎？」）\n  async function closeForm(d) {\n    const s = searchDialog(d);\n    if (s) { [...s.querySelectorAll(\"button\")].find(b => b.innerText.trim() === \"返回\")?.click(); await sleep(500); }\n    const b = [...d.querySelectorAll(\"button\")].find(x => x.innerText.trim() === \"關閉\");\n    if (b) await withConfirm(() => b.click());\n  }\n\n  const ddmmyyyy = s => { const [y, m, d] = s.split(\"/\"); return `${d.padStart(2, \"0\")}/${m.padStart(2, \"0\")}/${y}`; };\n\n  async function fill121(d, r) {\n    const notes = [];\n    const combos = d.querySelectorAll('[role=\"combobox\"]');\n    if (r.ext) { const why = await selectExt(d, r); if (why) notes.push(why); }\n    else if (!r._skipPick && !await pickOption(combos[0], t => sameName(t, r.name))) notes.push(`選單裡找不到「${r.name}」，請手動選`);\n    // 邀請人只有自己（value -2）\n    if (!await pickOption(combos[1], (t, v) => v === \"-2\" || sameName(t, data.me))) notes.push(\"請手動選邀請人\");\n    setText(d.querySelector('input[name=\"location\"]'), r.place);\n    setText(d.querySelector('textarea[name=\"comments\"]'), r.topic);\n    const date = d.querySelector('input[placeholder=\"DD/MM/YYYY\"]');\n    setText(date, ddmmyyyy(r.date));\n    if (date && date.value !== ddmmyyyy(r.date)) notes.push(`請手動把日期改成 ${r.date}`);\n    return notes;\n  }\n\n  async function fillRef(d, r) {\n    const notes = [];\n    const combo = d.querySelector('[role=\"combobox\"]');\n    if (r.ext) { const why = await selectExt(d, r); if (why) notes.push(why); }\n    else if (!r._skipPick && !await pickOption(combo, t => sameName(t, r.name))) notes.push(`選單裡找不到「${r.name}」，請手動選`);\n    setText(d.querySelector('input[name=\"referralPersonName\"]'), r.referredName);\n    const description = refDescriptionField(d);\n    if (description) setText(description, r.content);\n    else notes.push(\"找不到 BNI 引薦內容欄位，請手動填入；這筆不會自動送出\");\n    const radio = d.querySelector(`input[name=\"referralType\"][value=\"${r.type === \"內部\" ? \"INSIDE\" : \"OUTSIDE\"}\"]`);\n    if (radio && !radio.checked) radio.click();\n    setCheck(d.querySelector('input[name=\"cardGiven\"]'), [\"card\", \"both\"].includes(r.contact));\n    setCheck(d.querySelector('input[name=\"callRequired\"]'), [\"call\", \"both\"].includes(r.contact));\n    setText(d.querySelector('input[name=\"phoneNumber\"]'), r.phone);\n    return notes;\n  }\n\n  // ── 自動 key：填好後讀回每一欄，對得上才按「提交」 ─────────────────\n  const refDescriptionField = d => d.querySelector('textarea[name=\"referralDescription\"], input[name=\"referralDescription\"], textarea[name=\"comments\"], input[name=\"comments\"]');\n  function verify(kind, d, r) {\n    const bad = [];\n    const val = sel => d.querySelector(sel)?.value ?? \"\";\n    if (kind === \"121\") {\n      const c = d.querySelectorAll('[role=\"combobox\"]');\n      if (r.ext ? !pickedName(d, r.name) : !sameName(c[0]?.innerText, r.name)) bad.push(\"會面對象\");\n      if (/選擇/.test(c[1]?.innerText || \"選擇\")) bad.push(\"邀請人\");\n      if (val('input[name=\"location\"]') !== r.place) bad.push(\"地點\");\n      if (val('textarea[name=\"comments\"]') !== r.topic) bad.push(\"會談主題\");\n      if (val('input[placeholder=\"DD/MM/YYYY\"]') !== ddmmyyyy(r.date)) bad.push(\"日期\");\n    } else {\n      if (r.ext ? !pickedName(d, r.name) : !sameName(d.querySelector('[role=\"combobox\"]')?.innerText, r.name)) bad.push(\"引薦對象\");\n      if (val('input[name=\"referralPersonName\"]') !== r.referredName) bad.push(\"被引薦人姓名\");\n      const description = refDescriptionField(d);\n      if (!description || description.value !== r.content) bad.push(\"引薦內容\");\n      if (d.querySelector('input[name=\"referralType\"]:checked')?.value !== (r.type === \"內部\" ? \"INSIDE\" : \"OUTSIDE\")) bad.push(\"引薦類型\");\n      if (!!d.querySelector('input[name=\"cardGiven\"]')?.checked !== ([\"car ss=\"badge\">待確認\u003c/span>` : \"\"}\u003c/div>\n                \u003cdiv class=\"s\">${sub}\u003c/div>\n                ${data.note?.[k] ? `\u003cdiv class=\"note\">${done ? \"ℹ️\" : \"⚠️\"} ${esc(data.note[k])}\u003c/div>` : \"\"}\n                \u003cdiv class=\"row\" style=\"grid-column:2\">\n                  \u003cbutton class=\"fill\" data-fill=\"${i}\" ${run || done || pending ? \"disabled\" : \"\"}>填入\u003c/button>\n                  \u003clabel>\u003cinput type=\"checkbox\" data-done=\"${k}\" ${done ? \"checked\" : \"\"} ${run ? \"disabled\" : \"\"}>已完成\u003c/label>\n                  ${pending && !done ? `\u003cbutton class=\"link\" data-clear-pending=\"${k}\" ${run ? \"disabled\" : \"\"}>確認未送出，重新開放\u003c/button>` : \"\"}\n                \u003c/div>\n              \u003c/div>`;\n            }).join(\"\")}\n            ${!list.length ? `\u003cp class=\"hint\">這一類沒有要 key 的。\u003c/p>` : \"\"}\n            ${(() => {\n              const doneN = list.filter((_, i) => data.done[`${tab}-${i}`]).length;\n              return doneN ? `\u003cp>\u003cbutton class=\"link\" id=\"toggleDone\">${showDone ? \"隱藏\" : \"顯示\"}已完成的 ${doneN} 筆\u003c/button>\u003c/p>` : \"\";\n            })()}\n            \u003cbutton class=\"link\" id=\"fetch\">🔄 讀取最新資料\u003c/button>\n          `}\n        \u003c/div>\n      \u003c/div>`;\n  }\n\n  root.addEventListener(\"click\", async e => {\n    const t = e.target;\n    if (t.id === \"x\") { host.style.display = \"none\"; return; }\n    if (t.id === \"min\") { ui.min = !ui.min; saveUi(); render(); place(); return; }\n    if (t.dataset.tab) {\n      if (run) return;\n      tab = t.dataset.tab; msg = \"\"; confirming = false;\n      const b = root.querySelector(\".body\"); if (b) b.scrollTop = 0;\n      render(); return;\n    }\n    if (t.id === \"auto\") { confirming = true; msg = \"\"; render(); return; }\n    if (t.id === \"cancel\") { confirming = false; render(); return; }\n    if (t.id === \"go\") {\n      confirming = false;\n
