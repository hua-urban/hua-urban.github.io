const BOOKMARKLET = "javascript:" + encodeURIComponent(`(()=>{window.__huaGreenlightSite=${JSON.stringify(new URL("./", location.href).href)};${KEYIN_SOURCE}})()`);
function keyinData(rows, refRows) {
  const me = currentPerson();
  const contactKey = Object.fromEntries(["card", "call", "both", "none"].map(key => [contactLabel(key), key]));
  return {
    app: "hua-urban-greenlight", me: me ? me.name : "", meChapter: me ? me.chapter : "",
    rows121: rows.map(r => ({ name: r.name, chapter: r.chapter, ext: recipientCrossChapter(r.chapter),
      place: r.place, date: `${r.y || YEAR}/${r.m}/${r.d}`, topic: r.kind })),
    refs: refRows.map(r => ({ sourceId: r.sourceId, name: r.name, chapter: r.chapter, ext: recipientCrossChapter(r.chapter),
      type: r.type, referredName: r.referredName, content: r.content, phone: r.phone, contact: contactKey[r.contact] })),
  };
}

// 第一頁的教學影片：嵌入 YouTube（不留 Cookie 的網域），下面附原網址
function videoBlock() {
  const id = (VIDEO_URL.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/) || [])[1];
  if (!id) return "";
  return `<div class="video">
      <p class="video-h">▶ 10 分鐘影片教學</p>
      <div class="video-box"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="追綠光 10 分鐘影片教學"
        allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>
      <p class="video-l"><a href="${VIDEO_URL}" target="_blank" rel="noopener">在 YouTube 開啟</a></p>
    </div>`;
}

// 分流入口：在同一分頁切換到 121 或引薦流程
const PORTALS = {
  "121": { t: "補 Key 121", s: "" },
  ref:   { t: "補 Key 引薦", s: `${CHAPTER}夥伴、其他／手動輸入夥伴` },
};
const PORTAL_GAPS = {
  "121": { key: "O2O", target: m => Math.ceil(2 * m.weeks), unit: "次" },
  ref: { key: "RG", target: m => Math.ceil(1.5 * m.weeks), unit: "件" },
};
function portalCard(k, showGap = false) {
  const p = PORTALS[k];
  if (!p) return "";
  const gap = PORTAL_GAPS[k];
  const gapLabel = showGap && gap ? currentPerson()?.ext && !usesMonthlyChapterLight(currentPerson())
    ? `<span class="portal-count">此分會暫不查詢燈號</span>`
    : `<span class="portal-count" data-gap-flow="${k}" aria-live="polite">讀取本期差距中…</span>` : "";
  return `<a class="portal${showGap ? " has-gap" : ""}" href="?flow=${k}">
    <span class="pt">${p.t}</span><span class="ps">${k === "121" ? [`${CHAPTER}會員`, "其他活動／組聚", "其他／手動輸入會員", "已舉辦活動"].join("、") : p.s}</span>
    ${gapLabel}<span class="pg" aria-hidden="true">↗</span></a>`;
}
function updatePortalGaps(m) {
  document.querySelectorAll("[data-gap-flow]").forEach(el => {
    const goal = PORTAL_GAPS[el.dataset.gapFlow];
    if (!m || !goal) { el.textContent = "目前無法取得成績"; return; }
    const remaining = Math.max(0, goal.target(m) - m[goal.key]);
    el.textContent = `還差 ${remaining} ${goal.unit}`;
  });
}
function portals(only) {
  return `<div class="portals">${Object.keys(PORTALS).filter(k => !only || k === only).map(k => portalCard(k)).join("")}</div>`;
}

const CONNECT_LINKS = [
  { label: "網頁版", sub: "用電腦登入 BNI Connect", href: "https://www.bniconnectglobal.com/login" },
  { label: "iPhone App", sub: "App Store 下載 BNI Connect", href: "https://apps.apple.com/tw/app/bni-connect-mobile/id1212875170" },
  { label: "Android App", sub: "Google Play 下載 BNI Connect", href: "https://play.google.com/store/apps/details?id=com.bnimobile.global" },
];

function collect() {
  const rows = [];
  for (const ev of EVENTS) {
    for (const p of ev.people) {
      if (!(state.picked[ev.id] || new Set()).has(p.no) || p.no === state.me || isSelfTarget(p.name, p.chapter || CHAPTER)) continue;
      const [y, m, d] = ev.date;
      const kind = ev.title.replace(/^\S+\s/, "");
      const draft = { type: "event", eventId: ev.id, participant: p.no };
      if (p.ext) rows.push({ no: "", name: p.name, chapter: p.chapter, job: "", y, m, d, place: "實體", kind, src: ev.title, ext: recipientCrossChapter(p.chapter), draft });
      else if (ROSTER.has(p.no)) rows.push({ no: p.no, name: ROSTER.get(p.no).name, chapter: CHAPTER, job: ROSTER.get(p.no).job, y, m, d, place: "實體", kind, src: ev.title, ext: recipientCrossChapter(CHAPTER), draft });
    }
  }
  for (const g of state.gatherings || []) {
    if (!g.name.trim() || !validDate(g.m, g.d)) continue;
    const base = { m: +g.m, d: +g.d, place: g.venue.trim(), kind: g.name.trim(), src: "gather" };
    const group = { name: g.name, m: g.m, d: g.d, venue: g.venue };
    for (const no of g.members) if (ROSTER.has(no) && no !== state.me && !isSelfTarget(ROSTER.get(no).name, CHAPTER))
      rows.push({ no, name: ROSTER.get(no).name, chapter: CHAPTER, job: ROSTER.get(no).job, ...base,
        ext: recipientCrossChapter(CHAPTER), draft: { type: "gather-member", gatherId: g.id, participant: no, group } });
    for (const o of g.outside) if (o.name.trim() && !isSelfTarget(o.name, o.chapter))
      rows.push({ no: "", name: o.name.trim(), chapter: o.chapter.trim(), job: "", ...base,
        ext: recipientCrossChapter(o.chapter), draft: { type: "gather-outside", gatherId: g.id, personId: o.id,
          value: { ...o }, group } });
  }
  const one = Object.entries(state.meets).sort(([a], [b]) => a.localeCompare(b));
  for (const [no, v] of one) {
    const p = ROSTER.get(no);
    if (!p || isSelfTarget(p.name, CHAPTER)) continue;
    rows.push({ no, name: p.name, chapter: CHAPTER, job: p.job, m: +v.m, d: +v.d, place: v.place, kind: v.kind,
      src: "121", ext: recipientCrossChapter(CHAPTER), draft: { type: "meet", no, value: { ...v } } });
  }
  for (const v of state.outside) {
    if (!v.name.trim() || !validDate(v.m, v.d) || isSelfTarget(v.name, v.chapter)) continue;
    rows.push({ no: "", name: v.name.trim(), chapter: v.chapter.trim(), job: "", m: +v.m, d: +v.d, place: v.place, kind: v.kind,
      src: "outside", ext: recipientCrossChapter(v.chapter), draft: { type: "outside", personId: v.id, value: { ...v } } });
  }
  return rows;
}

function collectRefs() {
  const out = [];
  REF_QS.forEach((q, i) => {
    for (const r of state.refs[q.id] || []) {
      if (refBad(r, q.ext) || q.ext && isSelfTarget(r.name, r.chapter)) continue;
      const p = r.no ? ROSTER.get(r.no) : null;
      out.push({ qid: q.id, qn: i + 1, sourceId: r.id, no: r.no || "", name: p ? p.name : r.name.trim(),
        chapter: p ? CHAPTER : r.chapter.trim(), job: p ? p.job : "",
        type: r.type, referredName: r.referredName.trim(), content: r.content.trim(), phone: r.phone.trim(), contact: contactLabel(r.contact),
        draft: { type: "ref", qid: q.id, refId: r.id, value: { ...r } } });
    }
  });
  return out;
}

const CLEARED_DRAFT_ARCHIVE_KEY = "hua-urban-greenlight-last-cleared-drafts-v1";
const BRIDGE_KEY = "hua-urban-greenlight-keyin-v1";
const draftEqual = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function removeDraftSource(snapshot, source) {
  if (!source) return false;
  if (source.type === "event") {
    const picked = snapshot.picked?.[source.eventId];
    if (!Array.isArray(picked) || !picked.includes(source.participant)) return false;
    snapshot.picked[source.eventId] = picked.filter(no => no !== source.participant);
    return true;
  }
  if (source.type === "meet") {
    if (!draftEqual(snapshot.meets?.[source.no], source.value)) return false;
    delete snapshot.meets[source.no];
    return true;
  }
  if (source.type === "outside") {
    const list = snapshot.outside;
    if (!Array.isArray(list)) return false;
    const at = list.findIndex(value => (!source.personId || value.id === source.personId) && draftEqual(value, source.value));
    if (at < 0) return false;
    list.splice(at, 1);
    return true;
  }
  if (source.type === "gather-member" || source.type === "gather-outside") {
    const group = snapshot.gatherings?.find(value => value.id === source.gatherId);
    if (!group || !draftEqual({ name: group.name, m: group.m, d: group.d, venue: group.venue }, source.group)) return false;
    if (source.type === "gather-member") {
      if (!group.members?.includes(source.participant)) return false;
      group.members = group.members.filter(no => no !== source.participant);
    } else {
      const at = group.outside?.findIndex(value => (!source.personId || value.id === source.personId) && draftEqual(value, source.value)) ?? -1;
      if (at < 0) return false;
      group.outside.splice(at, 1);
    }
    if (!group.members.length && !group.outside.length) snapshot.gatherings = snapshot.gatherings.filter(value => value !== group);
    return true;
  }
  if (source.type === "ref") {
    const list = snapshot.refs?.[source.qid];
    if (!Array.isArray(list)) return false;
    const at = list.findIndex(value => value.id === source.refId && draftEqual(value, source.value));
    if (at < 0) return false;
    list.splice(at, 1);
    return true;
  }
  return false;
}
function replaceState(next) {
  for (const key of Object.keys(state)) delete state[key];
  Object.assign(state, next);
}
function createDraftCleanup(rows, refRows) {
  const removed = new Set();
  const sourceFor = item => item.kind === "121" ? rows[item.sourceIndex]?.draft
    : item.kind === "ref" ? refRows[item.sourceIndex]?.draft : null;
  const rowKey = item => `${item.kind}:${item.sourceIndex}`;
  function editUrl(item) {
    const source = sourceFor(item);
    if (!source || removed.has(rowKey(item))) return null;
    const params = new URLSearchParams();
    params.set("flow", item.kind);
    if (source.type === "event") {
      params.set("edit", `ev:${source.eventId}`);
      params.set("focus", source.participant);
    } else if (source.type === "meet") {
      params.set("edit", "indiv");
      params.set("focus", source.no);
    } else if (source.type === "outside") {
      params.set("edit", "ext");
      if (source.personId) params.set("focus", source.personId);
      else params.set("focusIndex", String(state.outside.findIndex(value => draftEqual(value, source.value))));
    } else if (source.type === "gather-member" || source.type === "gather-outside") {
      params.set("edit", "gather");
      params.set("group", source.gatherId);
      params.set("target", source.type === "gather-member" ? "member" : "outside");
      if (source.type === "gather-member") params.set("focus", source.participant);
      else if (source.personId) params.set("focus", source.personId);
      else {
        const group = state.gatherings.find(value => value.id === source.gatherId);
        params.set("focusIndex", String(group?.outside.findIndex(value => draftEqual(value, source.value)) ?? -1));
      }
    } else if (source.type === "ref") {
      params.set("edit", source.qid);
      params.set("focus", source.refId);
    } else return null;
    return `${location.pathname}?${params}`;
  }
  function edit(item) {
    const url = editUrl(item);
    if (!url || !currentMemberMatchesStored()) return false;
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!raw || raw.me !== state.me || !removeDraftSource(JSON.parse(JSON.stringify(raw)), sourceFor(item))) return false;
    } catch { return false; }
    location.assign(url);
    return true;
  }
  const all = [
    ...rows.map((_, sourceIndex) => ({ kind: "121", sourceIndex })),
    ...refRows.map((_, sourceIndex) => ({ kind: "ref", sourceIndex })),
  ];
  function clear(items, manual = false, rerender = false) {
    if (!currentMemberMatchesStored()) { returnToMemberPicker(); return false; }
    const previousState = { ...state };
    let raw, oldKey, oldDrafts, oldBridge, oldArchive;
    try {
      oldKey = localStorage.getItem(KEY);
      oldDrafts = localStorage.getItem(MEMBER_DRAFTS_KEY);
      oldBridge = localStorage.getItem(BRIDGE_KEY);
      oldArchive = localStorage.getItem(CLEARED_DRAFT_ARCHIVE_KEY);
      raw = JSON.parse(oldKey || "null");
      if (!raw || raw.me !== state.me) return false;
    } catch { return false; }
    const newlyRemoved = [];
    for (const item of items) {
      if (!Number.isInteger(item.sourceIndex) || item.sourceIndex < 0 || removed.has(rowKey(item))) continue;
      if (removeDraftSource(raw, sourceFor(item))) newlyRemoved.push(item);
    }
    if (!newlyRemoved.length) { if (rerender) render(); return true; }
    let next, bridge;
    try {
      next = readStored(JSON.parse(JSON.stringify(raw)));
      replaceState(next);
      bridge = { ...keyinData(collect(), collectRefs()), savedAt: Date.now() };
    } finally { replaceState(previousState); }
    try {
      const drafts = oldDrafts ? JSON.parse(oldDrafts) : {};
      if (!drafts || typeof drafts !== "object" || Array.isArray(drafts)) throw new Error("Invalid draft store");
      if (manual) localStorage.setItem(CLEARED_DRAFT_ARCHIVE_KEY, JSON.stringify({ memberKey: raw.me, savedAt: Date.now(), snapshot: JSON.parse(oldKey) }));
      drafts[raw.me] = raw;
      localStorage.setItem(MEMBER_DRAFTS_KEY, JSON.stringify(drafts));
      localStorage.setItem(KEY, JSON.stringify(raw));
      localStorage.setItem(BRIDGE_KEY, JSON.stringify(bridge));
    } catch {
      try {
        for (const [key, value] of [[MEMBER_DRAFTS_KEY, oldDrafts], [KEY, oldKey], [BRIDGE_KEY, oldBridge], [CLEARED_DRAFT_ARCHIVE_KEY, oldArchive]])
          value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value);
      } catch {}
      return false;
    }
    replaceState(next);
    for (const item of newlyRemoved) removed.add(rowKey(item));
    if (rerender) render();
    else {
      const count121 = $("#draft-count-121"), countRef = $("#draft-count-ref");
      if (count121) count121.textContent = String(collect().length);
      if (countRef) countRef.textContent = String(collectRefs().length);
      for (const [kind, count] of [["121", collect().length], ["ref", collectRefs().length]]) {
        const toggle = document.querySelector(`[data-draft-toggle="${kind}"]`);
        if (!toggle) continue;
        toggle.disabled = count === 0;
        if (!count) {
          toggle.setAttribute("aria-expanded", "false");
          const panel = document.getElementById(`draft-details-${kind}`);
          if (panel) panel.hidden = true;
          const hint = toggle.querySelector(".draft-toggle-hint");
          if (hint) hint.textContent = "目前沒有待辦";
        }
      }
      for (const item of newlyRemoved) {
        const chip = document.querySelector(`[data-draft-kind="${item.kind}"][data-draft-index="${item.sourceIndex}"]`);
        if (!chip) continue;
        const group = chip.closest("[data-draft-group]");
        chip.remove();
        if (group && !group.querySelector("[data-draft-kind]")) group.remove();
      }
    }
    return true;
  }
  return {
    confirmed: items => clear(items.filter(item => ["success", "already_sent"].includes(item.status)), false, false),
    clearOne: item => clear([item], true, true),
    clearAll: () => clear(all, true, true),
    edit,
    editUrl,
    refresh: () => render(),
  };
}

function download(rows, refRows) {
  if (!window.XLSX) { toast("Excel 元件還沒載入，請確認網路後再試一次"); return; }
  const me = currentPerson() || { no: "", name: "" };
  const head = ["我的姓名", "121 對象姓名", "分會", "發起人", "地點", "日期", "會談主題"];
  const ws = XLSX.utils.aoa_to_sheet([head, ...rows.map(r =>
    [me.name, r.name, r.chapter, me.name, r.place, null, r.kind])]);
  // 日期存成真正的 Excel 日期，排序、篩選都正常
  rows.forEach((r, i) => {
    const serial = (Date.UTC(r.y || YEAR, r.m - 1, r.d) - Date.UTC(1899, 11, 30)) / 864e5;
    ws[XLSX.utils.encode_cell({ r: i + 1, c: 5 })] = { t: "n", v: serial, z: "yyyy/mm/dd" };
  });
  ws["!cols"] = [14, 18, 12, 14, 8, 12, 14].map(wch => ({ wch }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "121");

  const ws2 = XLSX.utils.aoa_to_sheet([
    ["我的姓名", "引薦對象姓名", "分會", "被引薦人姓名", "內部／外部", "引薦內容", "電話", "聯絡方式"],
    ...refRows.map(r => [me.name, r.name, r.chapter, r.referredName, r.type, r.content, r.phone, r.contact])]);
  ws2["!cols"] = [14, 18, 12, 18, 10, 40, 14, 18].map(wch => ({ wch }));
  XLSX.utils.book_append_sheet(wb, ws2, "引薦");
  const filename = `${me.ext ? me.chapter + "_" : me.no}${me.name.split(" ")[0]}`.replace(/[\\/:*?"<>|]/g, "_");
  XLSX.writeFile(wb, `追綠光_${filename}.xlsx`);
}

// ── 完成結果先存此瀏覽器；有真實後台連線時才額外送到分會後台 ──
function clientId() {
  try {
    let id = localStorage.getItem("hua-urban-greenlight-client-v1");
    if (!id) { id = crypto.randomUUID(); localStorage.setItem("hua-urban-greenlight-client-v1", id); }
    return id;
  } catch { return clientId.mem ||= crypto.randomUUID(); }
}
async function submit(rows, refRows) {
  const me = currentPerson();
  if (!me) return "error";
  if (!currentMemberMatchesStored()) { returnToMemberPicker(); return "error"; }
  const payload = {
    p_client_id: clientId(), p_member_no: me.ext ? "" : me.no, p_member_name: me.name, p_member_chapter: me.chapter,
    p_rows_121: rows.map(({ src, draft, ...r }) => ({ ...r, date: `${r.y || YEAR}/${r.m}/${r.d}` })),
    p_rows_ref: refRows.map(({ qid, draft, ...r }) => ({ ...r, q: REF_QS[r.qn - 1].short })),
  };
  try {
    const key = "hua-urban-greenlight-submissions-v1";
    const saved = JSON.parse(localStorage.getItem(key) || "{}");
    saved[state.me] = {
      client_id: payload.p_client_id, member_no: payload.p_member_no, member_name: me.name, member_chapter: me.chapter,
      count_121: rows.length, count_ref: refRows.length,
      rows_121: payload.p_rows_121, rows_ref: payload.p_rows_ref,
      updated_at: new Date().toISOString(),
    };
    localStorage.setItem(key, JSON.stringify(saved));
  } catch { return "error"; }
  if (!SB_URL || !SB_KEY) return "local";
  try {
    const r = await fetch(SB_URL + "/rest/v1/rpc/bni_gl_submit", {
      method: "POST",
      headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    return r.ok ? "cloud" : "local";
  } catch { return "local"; }
}
function syncStatus(rows, refRows) {
  const el = $("#sent");
  if (!el) return;
  el.className = "sent"; el.textContent = "正在保存此瀏覽器的完成結果…";
  submit(rows, refRows).then(result => {
    if (!$("#sent")) return;
    el.className = "sent " + (result === "error" ? "fail" : "ok");
    el.textContent = result === "cloud" ? "✓ 已保存並送出到分會後台"
      : result === "local" ? "✓ 已保存在此瀏覽器；尚未保存到分會後台。仍可在本頁登入 BNI Connect 送出，或下載 Excel 備份"
      : "此瀏覽器無法保存完成結果；仍可在本頁使用 BNI Connect，或下載 Excel 備份";
  });
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("show"), 2400);
}

// 優先讀官網每週同步資料，官網暫時無法連線時才用隨版本附帶的備援檔。
(async () => {
  try {
    let configLoaded = false;
    for (const url of [ROSTER_DATA, "./defaults.json"]) {
      try {
        const response = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
        if (response.ok && applyConfig(await response.json())) { configLoaded = true; break; }
      } catch {}
    }
    if (!configLoaded) throw new Error("名單格式不正確");
    Object.assign(state, readStored());
  } catch {
    $("#app").innerHTML = `<section class="card"><p class="q">會員名單暫時讀不到</p><p class="hint">請稍後重新整理，或到 <a href="${LIGHT_SITE}" target="_blank" rel="noopener">華都更紅綠燈</a> 查詢。尚未載入經核對的名單，無法開始問卷。</p></section>`;
    return;
  }
  if (FLOW && !state.me) { location.replace(location.pathname); return; }
  // 每次進來都從入口開始：主頁直接到「紅綠燈＋補 key 121／引薦」，121 分頁從分類選單，引薦從同頁合併表單
  if (FLOW === "121") {
    const editEvent = EDIT_SECTION?.startsWith("ev:") && EVENTS.some(ev => ev.id === EDIT_SECTION.slice(3));
    state.sec = ["indiv", "ext", "gather"].includes(EDIT_SECTION) || editEvent ? EDIT_SECTION : null;
  }
  buildSteps();
  const editAt = FLOW === "121" && state.sec?.startsWith("ev:") && state.attended[state.sec.slice(3)] ? 1
    : 0;
  go(START_AT_WHO ? steps.findIndex(s => s.kind === "who") : !state.me ? 0 : FLOW ? editAt : steps.findIndex(s => s.kind === "light"));
  focusEditedDraft();
})();
