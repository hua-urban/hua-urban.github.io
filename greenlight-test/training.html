<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>華都更｜教育培訓實際紀錄</title>
<link rel="icon" type="image/x-icon" href="favicon.ico"><style>
:root{color-scheme:light;--ink:#17231c;--muted:#53645a;--green:#087137;--line:#c9d7ce}*{box-sizing:border-box}body{margin:0;background:#f4f8f5;color:var(--ink);font:16px/1.7 system-ui,"Noto Sans TC",sans-serif}main{max-width:920px;margin:auto;padding:28px 20px 60px}a{color:#086431}header a{font-weight:700}h1{font-size:30px;margin:22px 0 4px}h2{font-size:22px}.meta{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin:20px 0}select,input,button{font:inherit;padding:11px;border:1px solid #8c9e92;border-radius:8px;background:white;color:var(--ink)}label{display:block;font-weight:700;margin-bottom:8px}.tools{display:flex;gap:12px;flex-wrap:wrap}select{flex:1;min-width:230px}table{border-collapse:collapse;width:100%;font-size:15px}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid var(--line)}th{color:#405349}.scroll{overflow:auto}.badge{display:inline-block;background:#e3f6ea;color:#075a2b;padding:3px 10px;border-radius:30px}small{color:var(--muted)}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#eef5f0;padding:12px 18px;border-radius:12px}.stat strong{display:block;font-size:26px}button{cursor:pointer}#error{color:#9f2020}.note{background:#eef5f0;border-left:4px solid #087137;padding:12px}input:focus,select:focus,a:focus{outline:3px solid #136cb4;outline-offset:3px}
</style></head><body><main><header><a href="./">← 華都更追綠光</a></header><h1>教育培訓實際紀錄</h1><p class="meta" id="source">正在讀取實際資料…</p><section class="card"><label for="member">依會員編號或姓名選擇</label><div class="tools"><select id="member"><option value="">全部來源紀錄</option></select><input id="query" type="search" aria-label="搜尋培訓名稱或會員姓名" placeholder="搜尋培訓名稱或姓名"></div><p class="note">教育分數使用華都更 GitHub PALMS 的已入帳 CEU：2 單位 5 分、4 單位 10 分、6 單位 15 分。報名紀錄供查核，來源未提供出席與核定單位，因此不會按報名筆數重複加分。</p><div id="stats" class="stats"></div></section><section class="card"><h2 id="heading">華都更培訓紀錄</h2><p id="member-score"></p><p id="error" role="alert"></p><div class="scroll"><table><thead><tr><th>會員</th><th>培訓與場次</th><th>報名日期</th><th>來源狀態</th></tr></thead><tbody id="rows"></tbody></table></div><p><a href="https://bni-train.autolab.cloud/explorer/" target="_blank" rel="noopener">前往原始培訓報名查詢</a> · <a href="https://github.com/hua-urban/hua-urban.github.io/blob/master/traffic-light/data.json" target="_blank" rel="noopener">檢視 GitHub PALMS 資料</a></p></section></main><script src="training-support.js"></script><script>
(async()=>{const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const [data,cfg,palms]=await Promise.all([HuaTraining.load(),fetch('./defaults.json').then(r=>r.json()),fetch('./palms.json').then(r=>r.json())]);const roster=cfg.members;$('#source').textContent=`來源：華字輩培訓報名查詢 · 更新 ${data.sourceUpdatedAt} · ${data.records.length} 筆華都更實際報名紀錄（184 筆可對應現行會員，另 7 筆保留來源姓名、不自動歸戶）`;$('#member').innerHTML='<option value="">全部來源紀錄</option>'+roster.map(m=>`<option value="${esc(m.no)}">${esc(m.no)} ${esc(m.name)}</option>`).join('');const code=new URLSearchParams(location.search).get('member');if(roster.some(m=>m.no===code))$('#member').value=code;function draw(){const m=roster.find(m=>m.no===$('#member').value),q=$('#query').value.trim().toLowerCase();let rows=m?HuaTraining.recordsFor(m.name):data.records.slice().sort((a,b)=>(b.sessionDate||b.registeredAt).localeCompare(a.sessionDate||a.registeredAt));rows=rows.filter(r=>(r.name+' '+r.course+' '+r.sessionDate+' '+r.sessionLabel).toLowerCase().includes(q));$('#heading').textContent=m?`${m.no} ${m.name} 的培訓紀錄`:'華都更完整培訓紀錄';const p=m?(palms.members||[]).find(r=>HuaTraining.nameKey(r[1])===HuaTraining.nameKey(m.name)):null;const units=p?.[12];$('#member-score').textContent=m?(p?`PALMS 已入帳 CEU：${units} 單位，教育得分 ${units>=6?15:units>=4?10:units>=2?5:0} 分。統計期間：${palms.chapter.range}`:'本期 PALMS 尚無這位會員資料。'):'';$('#stats').innerHTML=`<div class="stat"><strong>${rows.length}</strong>筆報名紀錄</div><div class="stat"><strong>${new Set(rows.map(r=>r.name)).size}</strong>位會員</div><div class="stat"><strong>${new Set(rows.map(r=>r.course)).size}</strong>種培訓</div>`;$('#rows').innerHTML=rows.length?rows.map(r=>`<tr><td>${esc(r.name)}</td><td><b>${esc(r.course)}</b><br>${esc(r.sessionDate||r.sessionLabel||'未標場次')}<br><small>${esc(r.mode)} · ${esc(r.trainingType)}</small></td><td>${esc(r.registeredAt||'未提供')}</td><td><span class="badge">已報名</span><br><small>出席與認列待核對</small></td></tr>`).join(''):'<tr><td colspan="4">來源中查無符合的報名紀錄。</td></tr>';}$('#member').onchange=draw;$('#query').oninput=draw;draw();}catch(e){$('#error').textContent='無法讀取資料：'+e.message;}})();
</script></body></html>
